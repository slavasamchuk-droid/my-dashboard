<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылки</title>
<style>
  :root{
    --bg:#f5f5f7;
    --panel:#ffffff;
    --text:#1d1d1f;
    --text-secondary:#6e6e73;
    --text-tertiary:#a1a1a6;
    --accent:#0071e3;
    --accent-soft:#e8f2fe;
    --border:rgba(0,0,0,0.06);
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
    --shadow-hover:0 2px 6px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
  }
  html[data-theme="dark"]{
    --bg:#0c0e13;
    --panel:#15181f;
    --text:#eceef0;
    --text-secondary:#9aa0a8;
    --text-tertiary:#5c6169;
    --border:rgba(255,255,255,0.08);
    --shadow:none;
    --shadow-hover:none;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  .theme-toggle{
    position:fixed;
    top:20px;
    right:20px;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .2s, color .2s;
    overflow:hidden;
  }
  .theme-toggle:hover{
    color:var(--text);
  }
  .theme-toggle .icon{
    position:absolute;
    display:flex;
    transition:transform .45s cubic-bezier(.4,0,.2,1), opacity .45s ease;
  }
  .icon-moon{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .icon-bulb{
    opacity:0;
    transform:rotate(180deg) scale(0);
  }
  html[data-theme="dark"] .icon-moon{
    opacity:0;
    transform:rotate(-180deg) scale(0);
  }
  html[data-theme="dark"] .icon-bulb{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:64px 24px 100px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  h1{
    font-size:32px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .subtitle{
    color:var(--text-secondary);
    font-size:15px;
    margin:0;
  }

  .search-wrap{
    max-width:420px;
    margin:28px auto 0;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-tertiary);
  }
  input#searchInput{
    width:100%;
    background:rgba(118,118,128,0.08);
    border:none;
    border-radius:12px;
    padding:11px 14px 11px 38px;
    font-size:15px;
    color:var(--text);
    outline:none;
    font-family:inherit;
    transition:background .15s;
  }
  input#searchInput:focus{background:rgba(118,118,128,0.14);}
  input#searchInput::placeholder{color:var(--text-tertiary);}

  section.category{margin-bottom:32px;}
  .cat-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0 0 12px;
    padding-left:4px;
    transition:color .6s ease-in-out, text-shadow .6s ease-in-out;
    text-shadow:none;
  }
  section.category:has(a.pill:hover) .cat-title{
    color:#1b4d2e;
    text-shadow:
      0 0 2px rgba(27,77,46,0.55),
      0 0 6px rgba(27,77,46,0.45),
      0 0 12px rgba(27,77,46,0.3);
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  a.pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 16px;
    font-size:14px;
    font-weight:500;
    box-shadow:var(--shadow);
    transition:transform .12s, box-shadow .12s;
  }
  a.pill:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow-hover);
    background:#1b4d2e;
    color:#ffffff;
    border-color:#1b4d2e;
  }
  a.pill:active{transform:translateY(0);}

  html[data-theme="dark"] a.pill{
    background:var(--panel);
    border:1px solid rgba(43,219,122,0.4);
    color:#4fd18a;
    box-shadow:none;
    transition:transform .12s, color .4s ease-in-out, border-color .4s ease-in-out, box-shadow .4s ease-in-out;
  }
  html[data-theme="dark"] a.pill:hover{
    color:#ff8fc9;
    border-color:#ff2d95;
    background:var(--panel);
    box-shadow:0 0 8px rgba(255,45,149,0.55), 0 0 22px rgba(255,45,149,0.35);
  }
  .favicon{
    width:20px;
    height:20px;
    border-radius:6px;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:600;
    flex-shrink:0;
  }

  .empty{
    color:var(--text-tertiary);
    font-size:14px;
    text-align:center;
    padding:48px 0;
    display:none;
  }

  @media (max-width:600px){
    .wrap{padding:44px 18px 72px;}
    h1{font-size:26px;}
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
  <span class="icon icon-moon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
  </span>
  <span class="icon icon-bulb">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="10" r="4.5"></circle>
      <path d="M10 7.7 Q8.3 9 8.6 11.8"></path>
      <path d="M9.3 15.5h5.4"></path>
      <path d="M9.6 17h4.8"></path>
      <path d="M10 18.5h4"></path>
      <line x1="12" y1="3.5" x2="12" y2="1"></line>
      <line x1="16.6" y1="5.4" x2="18.4" y2="3.6"></line>
      <line x1="18.5" y1="10" x2="21" y2="10"></line>
      <line x1="16.6" y1="14.6" x2="18.4" y2="16.4"></line>
      <line x1="7.4" y1="14.6" x2="5.6" y2="16.4"></line>
      <line x1="5.5" y1="10" x2="3" y2="10"></line>
      <line x1="7.4" y1="5.4" x2="5.6" y2="3.6"></line>
    </svg>
  </span>
</button>

<div class="wrap">
  <header>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="text" placeholder="Поиск ссылки">
    </div>
  </header>

  <div id="content"></div>
  <p class="empty" id="emptyState">Ничего не найдено</p>
</div>

<script>
/*
  Как добавить свои ссылки:
  Каждая категория — объект с полем name и списком links.
  У ссылки: title (название), url (адрес) и необязательный aliases —
  список альтернативных написаний, например русскими буквами:
  { title: "Figma", url: "https://figma.com", aliases: ["фигма"] }
  По aliases тоже работает поиск, так что можно найти англоязычный
  сервис, даже если написать его название по-русски.
*/
const linksData = [
  {
    name: "Работа",
    links: [
      { title: "Почта", url: "https://mail.google.com" },
      { title: "Календарь", url: "https://calendar.google.com" },
      { title: "Трекер задач", url: "https://todoist.com", aliases: ["тудуист"] },
      { title: "Диск", url: "https://drive.google.com" },
    ]
  },
  {
    name: "Инструменты",
    links: [
      { title: "GitHub", url: "https://github.com", aliases: ["гитхаб", "гит"] },
      { title: "Figma", url: "https://figma.com", aliases: ["фигма"] },
      { title: "Notion", url: "https://notion.so", aliases: ["ноушен", "нотион"] },
    ]
  },
  {
    name: "Обучение",
    links: [
      { title: "Курс по SQL", url: "https://example.com/sql-course" },
      { title: "Документация", url: "https://docs.example.com" },
    ]
  },
  {
    name: "Разное",
    links: [
      { title: "Погода", url: "https://weather.com" },
      { title: "Новости", url: "https://news.example.com" },
    ]
  }
];

function initialOf(title){
  return title.trim().charAt(0).toUpperCase();
}

function render(filter){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();
  let totalShown = 0;

  linksData.forEach((cat) => {
    const filtered = cat.links.filter(l =>
      !q || l.title.toLowerCase().startsWith(q) ||
      cat.name.toLowerCase().startsWith(q) ||
      (l.aliases || []).some(a => a.toLowerCase().startsWith(q))
    );
    if(filtered.length === 0) return;
    totalShown += filtered.length;

    const section = document.createElement('section');
    section.className = 'category';

    const head = document.createElement('p');
    head.className = 'cat-title';
    head.textContent = cat.name;
    section.appendChild(head);

    const pills = document.createElement('div');
    pills.className = 'pills';

    filtered.forEach((l) => {
      const pill = document.createElement('a');
      pill.className = 'pill';
      pill.href = l.url;
      pill.target = '_blank';
      pill.rel = 'noopener noreferrer';
      pill.innerHTML = `<span>${l.title}</span>`;
      pills.appendChild(pill);
    });

    section.appendChild(pills);
    content.appendChild(section);
  });

  document.getElementById('emptyState').style.display = totalShown === 0 ? 'block' : 'none';
}

document.getElementById('searchInput').addEventListener('input', (e) => render(e.target.value));
render('');

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
});
</script>

</body>
</html>
