<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылки</title>
<script>
  /* Ставим тему ДО отрисовки страницы, иначе при перезагрузке в тёмной
     теме успевает мигнуть белый фон. */
  (function(){
    var saved = null;
    try{ saved = localStorage.getItem('dashboardTheme'); }catch(e){}
    if(saved !== 'dark' && saved !== 'light'){
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root{
    --bg:#f5f5f7;
    --panel:#ffffff;
    --text:#1d1d1f;
    --text-secondary:#6e6e73;
    --text-tertiary:#a1a1a6;
    --accent:#0071e3;
    --accent-soft:#e8f2fe;
    --border:rgba(0,0,0,0.06);
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
    --shadow-hover:0 2px 6px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
  }
  html[data-theme="dark"]{
    --bg:#0c0e13;
    --panel:#15181f;
    --text:#eceef0;
    --text-secondary:#9aa0a8;
    --text-tertiary:#5c6169;
    --border:rgba(255,255,255,0.08);
    --shadow:none;
    --shadow-hover:none;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  .sync-bar{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-tertiary);
    margin-bottom:24px;
  }
  .sync-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#34c759;
    flex-shrink:0;
  }
  .sync-dot.syncing{
    background:#d9b357;
    animation:sync-pulse 1s ease-in-out infinite;
  }
  .sync-dot.error{
    background:#ff3b30;
  }
  @keyframes sync-pulse{
    0%,100%{opacity:1;}
    50%{opacity:.35;}
  }
  .sync-refresh{
    border:none;
    background:transparent;
    color:var(--text-tertiary);
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:3px;
    border-radius:5px;
    transition:color .15s, background .15s, transform .4s;
  }
  .sync-refresh:hover{
    color:var(--text);
    background:rgba(118,118,128,0.08);
  }
  .sync-refresh.spinning svg{
    animation:sync-spin .7s linear infinite;
  }
  @keyframes sync-spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  .top-bar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:24px;
  }
  .settings-wrap{
    position:relative;
  }
  .settings-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
    padding:6px;
    min-width:240px;
    max-height:70vh;
    overflow-y:auto;
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    z-index:100;
  }
  .settings-menu.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .settings-menu a{
    display:block;
    padding:8px 12px;
    color:var(--text);
    text-decoration:none;
    border-radius:8px;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:background .12s;
  }
  .settings-menu a:hover{
    background:rgba(118,118,128,0.08);
  }

  .top-bar-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .reorder-toggle{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .2s, color .2s;
  }
  .reorder-toggle:hover{
    color:var(--text);
  }
  .reorder-toggle.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent);
  }

  .date-display{
    font-size:13px;
    color:var(--text-secondary);
    line-height:1.3;
    flex:1 1 auto;
    min-width:0;
  }
  .date-display .day{
    font-weight:600;
    color:var(--text);
  }
  .dd-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dd-row > #ddDate{
    flex:0 0 auto;
  }
  .dd-sep{
    width:1px;
    align-self:stretch;
    background:var(--border-strong, var(--border));
    flex-shrink:0;
    display:none;
  }
  .dd-ticker-wrap{
    overflow:hidden;
    /* Раньше было жёстко width:480px — длинные сообщения резались и
       бесконечно ползли, хотя справа пустовало полэкрана. Теперь окно
       занимает всё свободное место: большинство сообщений влезает
       целиком и просто стоит 6 секунд без прокрутки. */
    flex:1 1 auto;
    min-width:0;
    max-width:none;
    position:relative;
    height:16px;
    opacity:0;
    transition:opacity .6s ease;
  }
  .dd-ticker-wrap.show{
    opacity:1;
  }
  .dd-ticker-wrap:hover{
    cursor:default;
  }
  /* Мягкое затемнение правого края — видно, что текст продолжается */
  .dd-ticker-wrap::after{
    content:"";
    position:absolute;
    right:0;
    top:0;
    bottom:0;
    width:24px;
    pointer-events:none;
    background:linear-gradient(to right, transparent, var(--bg));
    opacity:0;
    transition:opacity .3s ease;
  }
  .dd-ticker-wrap.scrolling::after{
    opacity:1;
  }
  .dd-actions{
    display:flex;
    gap:6px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  button.dd-action-plan-link{
    font-family:inherit;
    cursor:pointer;
  }
  .events-panel{
    display:none;
    margin-top:8px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    max-height:420px;
    overflow-y:auto;
    font-size:12px;
    color:var(--text-secondary);
    box-shadow:var(--shadow);
    max-width:420px;
  }
  .events-panel .events-count{
    font-size:11px;
    color:var(--text-tertiary);
    padding-bottom:6px;
    margin-bottom:4px;
    border-bottom:1px solid var(--border);
  }
  .events-panel.open{
    display:block;
  }
  .events-panel .event-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:5px 0;
    border-bottom:1px solid var(--border);
  }
  .events-panel .event-row:last-child{
    border-bottom:none;
  }
  .events-panel .event-row.past{
    opacity:0.45;
  }
  .events-panel .event-name{
    color:var(--text);
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .events-panel .event-row.past .event-name{
    color:var(--text-secondary);
  }
  .events-panel .event-date{
    color:var(--text-tertiary);
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .events-panel .empty-hint{
    color:var(--text-tertiary);
    font-style:italic;
    padding:4px 0;
  }

  .dd-action-plan-link{
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-top:6px;
    font-size:10px;
    color:var(--text-tertiary);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 6px;
    transition:color .15s, border-color .15s, background .15s;
  }
  .dd-action-plan-link:hover{
    color:var(--text);
    border-color:var(--border-strong, var(--text-tertiary));
    background:rgba(118,118,128,0.08);
  }
  .dd-ticker{
    display:inline-block;
    white-space:nowrap;
    font-size:12px;
    color:var(--text-secondary);
    position:absolute;
    left:0;
    top:0;
    will-change:transform;
    transition:color .3s ease;
  }
  .dd-ticker.urgent{
    color:#ff3b30;
    font-weight:600;
  }

  .theme-toggle{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .2s, color .2s;
    overflow:hidden;
  }
  .theme-toggle:hover{
    color:var(--text);
  }
  .theme-toggle .icon{
    position:absolute;
    display:flex;
    transition:transform .45s cubic-bezier(.4,0,.2,1), opacity .45s ease;
  }
  .icon-moon{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .icon-bulb{
    opacity:0;
    transform:rotate(180deg) scale(0);
  }
  html[data-theme="dark"] .icon-moon{
    opacity:0;
    transform:rotate(-180deg) scale(0);
  }
  html[data-theme="dark"] .icon-bulb{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:64px 24px 100px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  h1{
    font-size:32px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .subtitle{
    color:var(--text-secondary);
    font-size:15px;
    margin:0;
  }

  .search-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:28px;
  }
  .quick-create{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    flex-shrink:0;
    border-radius:12px;
    background:rgba(118,118,128,0.08);
    color:var(--text-secondary);
    text-decoration:none;
    transition:background .15s, color .15s;
  }
  .quick-create:hover{
    background:rgba(118,118,128,0.14);
  }
  .quick-create.sheet-btn:hover{
    color:#1e8e3e;
  }
  .quick-create.doc-btn:hover{
    color:#1a73e8;
  }
  .search-wrap{
    max-width:420px;
    width:100%;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-tertiary);
  }
  input#searchInput{
    width:100%;
    background:rgba(118,118,128,0.08);
    border:none;
    border-radius:12px;
    padding:11px 14px 11px 38px;
    font-size:15px;
    color:var(--text);
    outline:none;
    font-family:inherit;
    transition:background .15s;
  }
  input#searchInput:focus{background:rgba(118,118,128,0.14);}
  input#searchInput::placeholder{color:var(--text-tertiary);}

  section.category{margin-bottom:32px;}
  section.category.draggable{
    cursor:grab;
    border-radius:12px;
    transition:background .15s, box-shadow .15s;
    padding:8px;
    margin-left:-8px;
    margin-right:-8px;
  }
  section.category.draggable:hover{
    background:rgba(118,118,128,0.06);
  }
  section.category.dragging{
    opacity:0.4;
  }
  section.category.drag-over{
    box-shadow:0 0 0 2px var(--accent);
  }
  .drag-handle{
    color:var(--text-tertiary);
    margin-right:6px;
    display:inline-flex;
    vertical-align:-3px;
  }
  .cat-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0 0 12px;
    padding-left:4px;
    transition:color .6s ease-in-out, text-shadow .6s ease-in-out;
    text-shadow:none;
  }
  @keyframes neonWarmUp{
    0%{
      color:var(--text-secondary);
      text-shadow:none;
    }
    45%{
      color:#1b4d2e;
      text-shadow:
        0 0 2px rgba(27,77,46,0.55),
        0 0 6px rgba(27,77,46,0.45),
        0 0 12px rgba(27,77,46,0.3);
    }
    100%{
      color:#c9d558;
      text-shadow:
        0 0 3px rgba(201,213,88,0.75),
        0 0 9px rgba(201,213,88,0.55),
        0 0 18px rgba(201,213,88,0.35);
    }
  }
  section.category:has(a.pill:hover) .cat-title{
    animation:neonWarmUp 1.1s ease-in-out forwards;
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  a.pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 16px;
    font-size:14px;
    font-weight:500;
    box-shadow:var(--shadow);
    transition:transform .12s, box-shadow .12s;
  }
  a.pill:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow-hover);
    background:#1b4d2e;
    color:#ffffff;
    border-color:#1b4d2e;
  }
  a.pill:active{transform:translateY(0);}

  html[data-theme="dark"] a.pill{
    background:var(--panel);
    border:1px solid rgba(43,219,122,0.4);
    color:#4fd18a;
    box-shadow:none;
    transition:transform .12s, color .4s ease-in-out, border-color .4s ease-in-out, box-shadow .4s ease-in-out;
  }
  html[data-theme="dark"] a.pill:hover{
    color:#ff8fc9;
    border-color:#ff2d95;
    background:var(--panel);
    box-shadow:0 0 8px rgba(255,45,149,0.55), 0 0 22px rgba(255,45,149,0.35);
  }

  .empty{
    color:var(--text-tertiary);
    font-size:14px;
    text-align:center;
    padding:48px 0;
    display:none;
  }

  .app-grid{
    display:flex;
    width:100%;
    max-width:400px;
    margin:22px auto 0;
  }
  .app-tile{
    flex:1 1 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-decoration:none;
  }
  .app-icon{
    width:28px;
    height:28px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    font-weight:600;
    font-size:10px;
    box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s;
  }
  .app-tile:hover .app-icon{
    transform:translateY(-2px) scale(1.05);
    box-shadow:var(--shadow-hover);
  }
  .app-label{
    font-size:11px;
    color:var(--text-secondary);
    text-align:center;
    line-height:1.2;
  }
  .tile-bitrix{background:#1976d2;}
  .tile-max{background:#7c4dff;}
  .tile-telegram{background:#29b6f6;}
  .tile-alio{background:#8e24aa;}
  .tile-pulse{background:#00897b;}
  .tile-amo{background:#43a047;}
  .tile-claude{background:#d97757;}
  .tile-chatgpt{background:#0f0f10;}

  @media (max-width:600px){
    .wrap{padding:44px 18px 72px;}
    h1{font-size:26px;}
    .app-grid{max-width:320px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="date-display" id="dateDisplay">
      <div class="dd-row">
        <div id="ddDate"></div>
        <div class="dd-sep" id="ddSep"></div>
        <div class="dd-ticker-wrap" id="ddTickerWrap"><span class="dd-ticker" id="ddTicker"></span></div>
      </div>
      <div class="dd-actions">
        <a class="dd-action-plan-link" href="https://docs.google.com/spreadsheets/d/1a_yEwDhiAfUonqoPorNj47n6ViBizJmn8v4jQjxVSgM/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer">
          Смотреть экшн план
        </a>
        <button class="dd-action-plan-link" id="eventsListBtn" type="button">
          Смотреть списком
        </button>
      </div>
      <div class="events-panel" id="eventsPanel"></div>
    </div>

    <div class="top-bar-actions">
      <div class="settings-wrap">
        <button class="reorder-toggle" id="settingsToggle" title="Все ссылки" aria-label="Все ссылки">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
        </button>
        <div class="settings-menu" id="settingsMenu"></div>
      </div>

      <button class="reorder-toggle" id="reorderToggle" title="Изменить порядок разделов" aria-label="Изменить порядок разделов">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
      </button>

      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <span class="icon icon-moon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
        </span>
        <span class="icon icon-bulb">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="10" r="4.5"></circle>
            <path d="M10 7.7 Q8.3 9 8.6 11.8"></path>
            <path d="M9.3 15.5h5.4"></path>
            <path d="M9.6 17h4.8"></path>
            <path d="M10 18.5h4"></path>
            <line x1="12" y1="3.5" x2="12" y2="1"></line>
            <line x1="16.6" y1="5.4" x2="18.4" y2="3.6"></line>
            <line x1="18.5" y1="10" x2="21" y2="10"></line>
            <line x1="16.6" y1="14.6" x2="18.4" y2="16.4"></line>
            <line x1="7.4" y1="14.6" x2="5.6" y2="16.4"></line>
            <line x1="5.5" y1="10" x2="3" y2="10"></line>
            <line x1="7.4" y1="5.4" x2="5.6" y2="3.6"></line>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <div class="sync-bar">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">Загрузка…</span>
    <button class="sync-refresh" id="syncRefresh" title="Обновить сейчас" aria-label="Обновить сейчас">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0114.13-3.36L23 10M1 14l5.36 4.36A9 9 0 0020.49 15"></path></svg>
    </button>
  </div>

  <header>

<script>
/*
  Как добавить свои ссылки:
  Каждая категория — объект с полем name и списком links.
  У ссылки: title (название), url (адрес) и необязательный aliases —
  список альтернативных написаний, например русскими буквами:
  { title: "Figma", url: "https://figma.com", aliases: ["фигма"] }
  По aliases тоже работает поиск, так что можно найти англоязычный
  сервис, даже если написать его название по-русски.
*/
/*
  Ссылки теперь читаются напрямую из Google Таблицы "Ссылки для дашборда":
  https://docs.google.com/spreadsheets/d/1xM2j5tKaIIN-nFhj9z9uNU1-1u3pQFflHJBslLlHI00/edit
  Колонки: category, title, url — просто добавляй новую строку в таблицу,
  категория группируется автоматически по первому столбцу.
*/
let linksData = [];

const ORDER_KEY = 'dashboardCategoryOrder';
let reorderMode = false;
let currentQuery = '';
let draggedName = null;

const FIREBASE_URL = 'https://slava-22b68-default-rtdb.firebaseio.com';
let syncCount = 0;

async function fbGet(path){
  const r = await fetch(`${FIREBASE_URL}/${path}.json`);
  if(!r.ok) throw new Error('Firebase GET ' + r.status);
  return r.json();
}
async function fbPut(path, value){
  const r = await fetch(`${FIREBASE_URL}/${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(value)
  });
  if(!r.ok) throw new Error('Firebase PUT ' + r.status);
  return r.json();
}

function updateSyncBar(state){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(!dot || !text) return;
  if(state === 'syncing'){
    dot.className = 'sync-dot syncing';
    text.textContent = 'Синхронизация…';
    return;
  }
  if(state === 'error'){
    dot.className = 'sync-dot error';
    text.textContent = 'Не удалось синхронизировать';
    return;
  }
  dot.className = 'sync-dot';
  const totalLinks = linksData.reduce((sum, c) => sum + c.links.length, 0);
  const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  text.textContent = `${totalLinks} ссылки · разделов: ${linksData.length} · синк #${syncCount} · синхронизировано в ${time}`;
}

async function syncDashboard(){
  updateSyncBar('syncing');
  try{
    let count = 0;
    try{ count = (await fbGet('dashboard/syncCount')) || 0; }catch(e){}
    count += 1;
    syncCount = count;
    await fbPut('dashboard/syncCount', count);
    await fbPut('dashboard/order', linksData.map(c => c.name));
    await fbPut('dashboard/lastSync', new Date().toISOString());
    console.log('[firebase] синхронизация #' + count + ' выполнена');
    updateSyncBar('done');
  }catch(e){
    console.error('[firebase] ошибка синхронизации:', e);
    updateSyncBar('error');
  }
}

async function loadOrderFromFirebase(){
  try{
    const saved = await fbGet('dashboard/order');
    if(Array.isArray(saved) && saved.length){
      sortByOrder(saved);
      render(currentQuery);
    }
    try{ syncCount = (await fbGet('dashboard/syncCount')) || 0; }catch(e){}
  }catch(e){
    console.warn('[firebase] не удалось получить порядок из облака, использую локальный:', e);
  }
  updateSyncBar('done');
}

/* Раньше сортировка была `saved.indexOf(a.name) - saved.indexOf(b.name)`.
   Для новой категории indexOf возвращает -1, и она прыгала в самый верх.
   Теперь неизвестные имена уходят в конец, сохраняя порядок из таблицы. */
function sortByOrder(order){
  if(!Array.isArray(order) || !order.length) return;
  const rank = new Map(order.map((name, i) => [name, i]));
  const BIG = order.length + 1;
  linksData.sort((a, b) => (rank.has(a.name) ? rank.get(a.name) : BIG) - (rank.has(b.name) ? rank.get(b.name) : BIG));
}

function applySavedOrder(){
  try{
    sortByOrder(JSON.parse(localStorage.getItem(ORDER_KEY) || 'null'));
  }catch(e){}
}

function saveOrder(){
  try{
    localStorage.setItem(ORDER_KEY, JSON.stringify(linksData.map(c => c.name)));
  }catch(e){}
  syncDashboard();
}

function moveCategory(fromName, toName){
  if(fromName === toName) return;
  const fromIndex = linksData.findIndex(c => c.name === fromName);
  const toIndex = linksData.findIndex(c => c.name === toName);
  if(fromIndex === -1 || toIndex === -1) return;
  const [moved] = linksData.splice(fromIndex, 1);
  linksData.splice(toIndex, 0, moved);
  saveOrder();
}

function render(filter){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();
  let totalShown = 0;

  linksData.forEach((cat) => {
    const filtered = cat.links.filter(l =>
      !q || l.title.toLowerCase().startsWith(q) ||
      cat.name.toLowerCase().startsWith(q) ||
      (l.aliases || []).some(a => a.toLowerCase().startsWith(q))
    );
    if(filtered.length === 0) return;
    totalShown += filtered.length;

    const section = document.createElement('section');
    section.className = 'category';
    section.dataset.cat = cat.name;

    const head = document.createElement('p');
    head.className = 'cat-title';
    if(reorderMode){
      head.innerHTML = '<span class="drag-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"></circle><circle cx="16" cy="6" r="1.6"></circle><circle cx="8" cy="12" r="1.6"></circle><circle cx="16" cy="12" r="1.6"></circle><circle cx="8" cy="18" r="1.6"></circle><circle cx="16" cy="18" r="1.6"></circle></svg></span>';
    }
    head.appendChild(document.createTextNode(cat.name));
    section.appendChild(head);

    if(reorderMode){
      section.classList.add('draggable');
      section.draggable = true;
      section.addEventListener('dragstart', () => {
        draggedName = cat.name;
        section.classList.add('dragging');
      });
      section.addEventListener('dragend', () => {
        section.classList.remove('dragging');
      });
      section.addEventListener('dragover', (e) => {
        e.preventDefault();
        section.classList.add('drag-over');
      });
      section.addEventListener('dragleave', (e) => {
        if(!section.contains(e.relatedTarget)){
          section.classList.remove('drag-over');
        }
      });
      section.addEventListener('drop', (e) => {
        e.preventDefault();
        section.classList.remove('drag-over');
        if(draggedName){
          moveCategory(draggedName, cat.name);
          draggedName = null;
          render(currentQuery);
        }
      });
    }

    const pills = document.createElement('div');
    pills.className = 'pills';

    filtered.forEach((l) => {
      const pill = document.createElement('a');
      pill.className = 'pill';
      pill.href = l.url;
      pill.target = '_blank';
      pill.rel = 'noopener noreferrer';
      const label = document.createElement('span');
      label.textContent = l.title;
      pill.appendChild(label);
      pills.appendChild(pill);
    });

    section.appendChild(pills);
    content.appendChild(section);
  });

  document.getElementById('emptyState').style.display = totalShown === 0 ? 'block' : 'none';
}

applySavedOrder();

function renderDate(){
  const el = document.getElementById('ddDate');
  const now = new Date();
  const weekday = now.toLocaleDateString('ru-RU', { weekday: 'long' });
  const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const weekdayCap = weekday.charAt(0).toUpperCase() + weekday.slice(1);
  el.innerHTML = `<span class="day">${weekdayCap}</span><br>${dateStr}<br>${timeStr}`;
}
renderDate();

/* Раньше было setInterval(renderDate, 30000) — часы могли отставать
   до 30 секунд. Теперь первый тик подгоняется к границе минуты,
   дальше ровно раз в минуту. Плюс обновляем при возврате на вкладку. */
(function startClock(){
  const msToNextMinute = 60000 - (Date.now() % 60000);
  setTimeout(() => {
    renderDate();
    setInterval(renderDate, 60000);
  }, msToNextMinute + 50);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) renderDate();
  });
})();

/*
  Дорожная карта: читает лист "Активности" (гид 147658334) через
  публичный gviz-эндпоинт (без API-ключа, работает если у таблицы
  открыт доступ "по ссылке"). Ищет ячейки с маркером "!" в сетке
  дат, вычисляет дату по шапке (месяц + число) и берёт название
  события из колонки A или B той же строки.
*/
const ROADMAP_SHEET_ID = '1a_yEwDhiAfUonqoPorNj47n6ViBizJmn8v4jQjxVSgM';
const ROADMAP_GID = '0';
const ROADMAP_MARKER = '!';
const RU_MONTHS = {
  'январь':0,'февраль':1,'март':2,'апрель':3,'май':4,'июнь':5,
  'июль':6,'август':7,'сентябрь':8,'октябрь':9,'ноябрь':10,'декабрь':11
};
/* Короткие корни — ловят и «Ноябрь», и «ноя», и «нояб.», и «ноября».
   Порядок важен: «мар» должен проверяться раньше «май» не мешает,
   но «июн»/«июл» обязаны идти до «ию». */
const RU_MONTH_STEMS = [
  ['янв',0],['фев',1],['февр',1],['мар',2],['апр',3],['мая',4],['май',4],
  ['июн',5],['июл',6],['авг',7],['сен',8],['окт',9],['ноя',10],['дек',11]
];

function pluralDays(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return 'дней';
  if(mod10 === 1) return 'день';
  if(mod10 >= 2 && mod10 <= 4) return 'дня';
  return 'дней';
}

function pluralMonths(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return 'месяцев';
  if(mod10 === 1) return 'месяц';
  if(mod10 >= 2 && mod10 <= 4) return 'месяца';
  return 'месяцев';
}

function formatRemaining(today, eventDate){
  const totalDays = Math.round((eventDate - today) / 86400000);
  if(totalDays < 15){
    return `${totalDays} ${pluralDays(totalDays)}`;
  }
  let months = (eventDate.getFullYear() - today.getFullYear()) * 12 + (eventDate.getMonth() - today.getMonth());
  let days = eventDate.getDate() - today.getDate();
  if(days < 0){
    months--;
    const prevMonthLastDay = new Date(eventDate.getFullYear(), eventDate.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if(months <= 0){
    return `${totalDays} ${pluralDays(totalDays)}`;
  }
  if(days === 0){
    return `${months} ${pluralMonths(months)}`;
  }
  return `${months} ${pluralMonths(months)} и ${days} ${pluralDays(days)}`;
}

function formatEventDate(d){
  const day = d.getDate();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  return `${day}.${month}.${year}`;
}

function findMonthIndex(cellText){
  if(cellText == null) return null;
  const t = cellText.toString().trim().toLowerCase().replace(/ё/g, 'е');
  if(!t) return null;
  for(const name in RU_MONTHS){
    if(t.startsWith(name)) return RU_MONTHS[name];
  }
  for(let i = 0; i < RU_MONTH_STEMS.length; i++){
    if(t.startsWith(RU_MONTH_STEMS[i][0])) return RU_MONTH_STEMS[i][1];
  }
  return null;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field = ''; }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(ch === '\r'){ /* пропускаем */ }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function processRoadmapCSV(text){
  try{
    const rows = parseCSV(text);
    console.log('[roadmap] всего строк:', rows.length);
    if(!rows.length) return;

    /* Ширина сетки считается по ВСЕМ строкам.
       Раньше цикл шёл до rows[monthRow].length — а gviz обрезает
       у каждой строки пустой «хвост», поэтому строка месяцев почти
       всегда короче строки чисел. Все колонки правее обрезки дат не
       получали, и события из этих месяцев терялись. */
    const width = rows.reduce((w, r) => Math.max(w, r ? r.length : 0), 0);
    console.log('[roadmap] ширина сетки:', width);

    // Строка месяцев — та, где названий месяцев БОЛЬШЕ ВСЕГО,
    // а не просто первая попавшаяся с одним словом «Июль» в заголовке.
    let monthRow = -1, bestMonths = 0;
    for(let i = 0; i < Math.min(rows.length, 40); i++){
      let n = 0;
      for(let c = 0; c < rows[i].length; c++) if(findMonthIndex(rows[i][c]) !== null) n++;
      if(n > bestMonths){ bestMonths = n; monthRow = i; }
    }
    if(monthRow === -1){ console.error('[roadmap] не нашёл строку с названиями месяцев'); return; }

    const isDayNum = (v) => {
      const n = parseInt(v, 10);
      return !isNaN(n) && n >= 1 && n <= 31 && String(v).trim().length <= 2;
    };
    // Строка чисел — не обязательно ровно следующая: ищем в ближайших
    // четырёх строках ту, где больше всего чисел 1–31.
    let dayRow = -1, bestDays = 0;
    for(let i = monthRow; i <= Math.min(monthRow + 4, rows.length - 1); i++){
      let n = 0;
      for(let c = 0; c < rows[i].length; c++) if(isDayNum(rows[i][c])) n++;
      if(n > bestDays){ bestDays = n; dayRow = i; }
    }
    if(dayRow === -1 || !bestDays){ console.error('[roadmap] не нашёл строку с числами дней'); return; }
    console.log('[roadmap] строка месяцев:', monthRow, '(названий:', bestMonths + ')',
                '/ строка чисел:', dayRow, '(чисел:', bestDays + ')');

    const today = new Date();
    today.setHours(0,0,0,0);

    // 1) Месяц для каждой колонки: протяжка вправо от подписи
    //    (объединённые ячейки приходят пустыми — держим последний месяц)
    const monthOf = new Array(width).fill(null);
    let cur = null;
    for(let c = 0; c < width; c++){
      const m = findMonthIndex((rows[monthRow] || [])[c]);
      if(m !== null) cur = m;
      monthOf[c] = cur;
    }

    // 2) Дни
    const dayOf = new Array(width).fill(null);
    for(let c = 0; c < width; c++){
      const v = (rows[dayRow] || [])[c];
      if(isDayNum(v)) dayOf[c] = parseInt(v, 10);
    }

    /* 3) Колонки ЛЕВЕЕ первой подписи месяца.
       Раньше они просто выбрасывались (curMonth === null → continue),
       из-за чего терялось всё начало календаря. Теперь идём справа
       налево от первого известного месяца: если число растёт при
       движении влево — значит перешли в предыдущий месяц. */
    let firstKnown = monthOf.findIndex(m => m !== null);
    if(firstKnown > 0){
      let m = monthOf[firstKnown];
      let nextDay = dayOf[firstKnown];
      for(let c = firstKnown - 1; c >= 0; c--){
        if(dayOf[c] === null) continue;
        if(nextDay !== null && dayOf[c] > nextDay) m = (m + 11) % 12;
        monthOf[c] = m;
        nextDay = dayOf[c];
      }
    }

    // 4) Год: считаем от первой колонки, увеличиваем на переходе через декабрь
    const colDate = {};
    let year = today.getFullYear(), prevMonth = null;
    for(let c = 0; c < width; c++){
      if(dayOf[c] === null || monthOf[c] === null) continue;
      if(prevMonth !== null && monthOf[c] < prevMonth) year++;
      prevMonth = monthOf[c];
      colDate[c] = new Date(year, monthOf[c], dayOf[c]);
    }

    /* Название события берётся строго из колонки B. */
    const NAME_COL = 1;
    const dateCols = Object.keys(colDate).map(Number).sort((a, b) => a - b);
    // Колонки A и B — это название, маркеры там не ищем никогда
    const firstDateCol = Math.max(dateCols.length ? dateCols[0] : 2, 2);
    if(dateCols.length){
      const f = colDate[dateCols[0]], l = colDate[dateCols[dateCols.length - 1]];
      console.log('[roadmap] сетка дат: колонки', dateCols[0], '…', dateCols[dateCols.length - 1],
                  '=', formatEventDate(f), '…', formatEventDate(l), '/ всего колонок:', dateCols.length);
    } else {
      console.error('[roadmap] сетка дат пустая — ни одна колонка не получила дату');
    }

    function rowName(row){
      return (row[NAME_COL] || '').trim();
    }

    const dataStart = dayRow + 1;
    const matches = [];
    const seen = new Set();
    let lastName = '';   // протяжка вниз для вертикально объединённых названий
    for(let r = dataStart; r < rows.length; r++){
      const row = rows[r];
      if(!row) continue;
      const ownName = rowName(row);
      if(ownName) lastName = ownName;

      for(let c = firstDateCol; c < row.length; c++){
        const cell = row[c];
        if(!cell || !colDate[c]) continue;
        // «!» может прийти как обычный, так и полноширинный «！»
        if(cell.indexOf(ROADMAP_MARKER) === -1 && cell.indexOf('！') === -1) continue;
        const name = ownName || lastName;
        if(!name){ console.warn('[roadmap] маркер без названия, строка', r, 'колонка', c); continue; }
        const key = name + '@' + colDate[c].getTime();
        if(seen.has(key)) continue;
        seen.add(key);
        matches.push({ name, date: colDate[c] });
      }
    }

    console.log('[roadmap] начало данных со строки:', dataStart, '/ найдено маркеров "!":', matches.length, matches);

    allEvents = matches.sort((a, b) => a.date - b.date);
    eventsSource = 'таблица';
    populateEventsPanel();

    const upcoming = matches
      .filter(m => m.date >= today)
      .sort((a, b) => a.date - b.date);

    console.log('[roadmap] будущих событий:', upcoming.length, upcoming);

    if(upcoming.length){
      tickerMessages = upcoming.slice(0, TICKER_MAX_ITEMS).map(m => {
        const days = Math.round((m.date - today) / 86400000);
        return {
          text: `До мероприятия «${m.name}» осталось ${formatRemaining(today, m.date)} · ${formatEventDate(m.date)}`,
          urgent: days < 14
        };
      });
      console.log('[roadmap] сообщения тикера:', tickerMessages);
      startTicker();
    } else {
      console.warn('[roadmap] маркеры есть, но все даты в прошлом либо не распознаны');
    }
  }catch(e){
    console.error('[roadmap] ошибка разбора:', e);
  }
}

/* ------------------------------------------------------------------
   Тикер мероприятий.

   Важно: раньше showNextTicker() запускался из ДВУХ мест (fallback-список
   сразу при загрузке + разбор таблицы, когда она приедет) и ещё раз при
   каждом нажатии «Обновить». Каждый запуск создавал СВОЮ цепочку
   setTimeout, цепочки шли параллельно и перебивали друг друга — из-за
   этого сообщения мелькали доли секунды. Теперь цепочка ровно одна:
   startTicker() гасит предыдущую перед запуском новой.

   Прокрутку ведёт requestAnimationFrame, а не CSS-transition, — только
   так её можно честно поставить на паузу и продолжить с того же места.
------------------------------------------------------------------- */
const TICKER_FADE_MS   = 600;   // затухание / появление
const TICKER_MIN_MS    = 6000;  // минимум времени на одно сообщение
const TICKER_END_PAUSE = 2500;  // пауза после докрутки длинного текста
const TICKER_SPEED     = 40;    // px в секунду
/* Сколько ближайших событий крутить в ленте.
   При 12 событиях круг занимал ~90 секунд, и каждое конкретное
   мероприятие появлялось раз в полторы минуты — ленту было
   бесполезно смотреть. Пять ближайших дают круг ~35 секунд.
   Полный список остаётся в кнопке «Смотреть списком». */
const TICKER_MAX_ITEMS = 5;

let tickerIndex = 0;
let tickerPaused = false;
let tickerRAF = null;
let tickerFadeTimer = null;
let tickerJob = null;
let tickerSignature = null;

function stopTicker(){
  if(tickerRAF){ cancelAnimationFrame(tickerRAF); tickerRAF = null; }
  if(tickerFadeTimer){ clearTimeout(tickerFadeTimer); tickerFadeTimer = null; }
  tickerJob = null;
}

function tickerFrame(now){
  tickerRAF = null;
  const job = tickerJob;
  if(!job) return;
  const dt = now - job.last;
  job.last = now;
  if(!tickerPaused){
    job.elapsed += dt;
    if(job.onProgress) job.onProgress(Math.min(job.elapsed, job.duration));
  }
  if(job.elapsed >= job.duration){
    tickerJob = null;
    job.done();
    return;
  }
  tickerRAF = requestAnimationFrame(tickerFrame);
}

// Отсчёт, который замирает, пока tickerPaused === true
function tickerRun(duration, onProgress, done){
  if(tickerRAF) cancelAnimationFrame(tickerRAF);
  tickerJob = { duration, onProgress, done, elapsed: 0, last: performance.now() };
  tickerRAF = requestAnimationFrame(tickerFrame);
}

// Единственная точка входа. Перезапускает тикер, только если список
// сообщений реально изменился, — иначе кнопка «Обновить» сбрасывала бы
// текущее сообщение на первое.
function startTicker(force){
  if(!tickerMessages.length) return;
  const sig = JSON.stringify(tickerMessages.map(m => typeof m === 'string' ? m : m.text));
  if(!force && sig === tickerSignature) return;
  tickerSignature = sig;

  stopTicker();
  tickerIndex = 0;
  const sep = document.getElementById('ddSep');
  if(sep) sep.style.display = 'block';
  showNextTicker();
}

function showNextTicker(){
  if(!tickerMessages.length) return;
  const wrap = document.getElementById('ddTickerWrap');
  const el = document.getElementById('ddTicker');
  if(!wrap || !el) return;

  stopTicker();
  wrap.classList.remove('show', 'scrolling');

  tickerFadeTimer = setTimeout(() => {
    const raw = tickerMessages[tickerIndex];
    const msg = (typeof raw === 'string') ? { text: raw, urgent: false } : raw;

    el.style.transform = 'translateX(0)';
    el.textContent = msg.text;
    el.classList.toggle('urgent', !!msg.urgent);
    void el.offsetWidth; // reflow, чтобы scrollWidth посчитался по новому тексту
    wrap.classList.add('show');

    tickerFadeTimer = setTimeout(() => {
      const overflow = Math.max(0, el.scrollWidth - wrap.clientWidth);
      const next = () => {
        tickerIndex = (tickerIndex + 1) % tickerMessages.length;
        showNextTicker();
      };

      if(overflow > 0){
        wrap.classList.add('scrolling');
        const scrollMs = Math.max(2000, (overflow / TICKER_SPEED) * 1000);
        const total = Math.max(TICKER_MIN_MS, scrollMs + TICKER_END_PAUSE);
        tickerRun(total, (t) => {
          const p = Math.min(1, t / scrollMs);
          el.style.transform = `translateX(-${(overflow * p).toFixed(1)}px)`;
        }, next);
      } else {
        // Короткое сообщение — стоит ровно TICKER_MIN_MS
        tickerRun(TICKER_MIN_MS, null, next);
      }
    }, TICKER_FADE_MS);
  }, TICKER_FADE_MS);
}

// Пауза при наведении: замирает и прокрутка, и отсчёт до следующего
// сообщения. Убрал курсор — продолжает ровно с того же места.
(function initTickerPause(){
  const wrap = document.getElementById('ddTickerWrap');
  if(!wrap) return;
  const pause  = () => { tickerPaused = true;  };
  const resume = () => { tickerPaused = false; };
  wrap.addEventListener('mouseenter', pause);
  wrap.addEventListener('mouseleave', resume);
  wrap.addEventListener('touchstart', pause, { passive: true });
  wrap.addEventListener('touchend', resume);
  wrap.addEventListener('touchcancel', resume);
  // Вкладка неактивна — не крутим впустую
  document.addEventListener('visibilitychange', () => {
    tickerPaused = document.hidden ? true : wrap.matches(':hover');
  });
})();

/* ------------------------------------------------------------------
   Общий загрузчик Google-таблиц.

   Раньше обе таблицы (ссылки и роадмап) писали в ОДИН глобальный колбэк
   google.visualization.Query.setResponse. При наложении ответов данные
   роадмапа могли попасть в обработчик ссылок. Теперь на каждый запрос
   генерируется уникальное имя колбэка и передаётся через
   tqx=out:json;responseHandler:<имя> — таблицы больше не пересекаются.

   Порядок попыток:
     1) JSONP (без CORS, без прокси)
     2) прямой fetch CSV (иногда проходит)
     3) публичные CORS-прокси по очереди — только как крайняя мера,
        потому что прокси видит содержимое таблицы
------------------------------------------------------------------- */
let gvizCallbackSeq = 0;

const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`
];

function gvizToCSV(resp){
  const rows = resp.table.rows.map(r => (r.c || []).map(c => (c && (c.f || c.v) != null) ? String(c.f || c.v) : ''));
  return rows.map(r => r.map(v => `"${(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
}

/* Разбирает подпись колонки из двухстрочной шапки gviz.
   «июль 24» → ['июль','24'],  «25» → ['','25'] */
function splitHeaderLabel(label){
  const t = (label == null ? '' : String(label)).trim();
  const m = t.match(/^(.*?)\s*(\d{1,2})$/);
  if(m) return [m[1].trim(), m[2]];
  return [t, ''];
}

/* Когда шапка занимает две строки (месяц + число), просим gviz считать
   их заголовком: headers=2. Это критично — иначе gviz приводит каждую
   колонку к одному типу, видит в верхней строке число и объявляет
   колонку числовой, а все «!» ниже отдаёт как null. Маркеры пропадают
   ещё до парсера. С headers=2 в данных остаются только «!» и пустоты,
   тип колонки — строка, и ничего не теряется.
   Месяц и число потом восстанавливаем из подписей колонок. */
function gvizToCSVWithHeader(resp){
  const cols = resp.table.cols || [];
  const monthRow = [], dayRow = [];
  cols.forEach(col => {
    const [m, d] = splitHeaderLabel(col && col.label);
    monthRow.push(m);
    dayRow.push(d);
  });
  const body = resp.table.rows.map(r => (r.c || []).map(c => (c && (c.f || c.v) != null) ? String(c.f || c.v) : ''));
  const all = [monthRow, dayRow].concat(body);
  return all.map(r => r.map(v => `"${(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
}

// tag — префикс для логов, onCSV(text) — что делать с данными,
// onDone() — вызывается ровно один раз, чем бы дело ни кончилось
function loadSheet(tag, sheetId, gid, onCSV, opts){
  opts = opts || {};
  const headerRows = opts.headerRows || 0;
  const onDone = opts.onDone;
  let settled = false;
  const finish = (ok) => {
    if(settled) return;
    settled = true;
    if(!ok) console.error(`[${tag}] все способы загрузки не сработали`);
    if(onDone) onDone();
  };

  const cbName = `__gviz_${tag}_${++gvizCallbackSeq}`;
  const scriptId = `${tag}-loader-script`;
  const old = document.getElementById(scriptId);
  if(old) old.remove();

  let answered = false;
  const cleanup = () => {
    try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
    const s = document.getElementById(scriptId);
    if(s) s.remove();
  };

  window[cbName] = function(resp){
    answered = true;
    console.log(`[${tag}] получен ответ от таблицы`);
    cleanup();
    if(!resp || resp.status !== 'ok'){
      console.error(`[${tag}] таблица вернула ошибку:`, resp && (resp.errors || resp.status));
      tryCSV();
      return;
    }
    try{ onCSV(headerRows === 2 ? gvizToCSVWithHeader(resp) : gvizToCSV(resp)); finish(true); }
    catch(e){ console.error(`[${tag}] ошибка обработки:`, e); finish(false); }
  };

  const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;

  function tryCSV(i = -1){
    if(settled) return;
    const url = (i < 0) ? csvUrl : (CORS_PROXIES[i] && CORS_PROXIES[i](csvUrl));
    if(!url){ finish(false); return; }
    if(i >= 0) console.warn(`[${tag}] пробую CORS-прокси #${i + 1}`);
    fetch(url)
      .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(text => {
        if(settled) return;
        console.log(`[${tag}] CSV получен, символов:`, text.length);
        onCSV(text);
        finish(true);
      })
      .catch(e => {
        console.warn(`[${tag}] источник не сработал:`, e.message || e);
        tryCSV(i + 1);
      });
  }

  const script = document.createElement('script');
  script.id = scriptId;
  script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?gid=${gid}&headers=${headerRows}&tqx=out:json;responseHandler:${cbName}`;
  script.onerror = () => { cleanup(); if(!answered) tryCSV(); };
  console.log(`[${tag}] загружаю (JSONP)`);
  document.body.appendChild(script);
  setTimeout(() => { if(!answered && !settled){ console.warn(`[${tag}] таймаут JSONP`); cleanup(); tryCSV(); } }, 5000);
}

function loadRoadmap(){

function processLinksCSV(text){
  try{
    const rows = parseCSV(text).filter(r => r.some(cell => cell && cell.trim()));
    if(!rows.length){ console.warn('[links] таблица пуста'); return; }

    const header = rows[0].map(h => (h || '').trim().toLowerCase());
    let ci = header.indexOf('category'), ti = header.indexOf('title'), ui = header.indexOf('url');
    let dataRows = rows;
    if(ci !== -1 && ti !== -1 && ui !== -1){
      dataRows = rows.slice(1);
    } else {
      ci = 0; ti = 1; ui = 2;
    }

    const map = new Map();
    dataRows.forEach(r => {
      const cat = (r[ci] || '').trim();
      const title = (r[ti] || '').trim();
      const url = (r[ui] || '').trim();
      if(!cat || !title || !url) return;
      if(!map.has(cat)) map.set(cat, []);
      map.get(cat).push({ title, url });
    });

    linksData = Array.from(map.entries()).map(([name, links]) => ({ name, links }));
    console.log('[links] загружено категорий:', linksData.length, linksData);
    applySavedOrder();
    render(currentQuery);
    loadOrderFromFirebase();
  }catch(e){
    console.error('[links] ошибка разбора:', e);

}
