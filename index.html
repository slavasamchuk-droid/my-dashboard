<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Директория</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10151c;
    --surface:#171e27;
    --surface-hover:#1d2530;
    --border:#262e39;
    --border-strong:#3a4453;
    --text:#e7e9ea;
    --text-secondary:#8b95a1;
    --text-muted:#5c6672;
    --accent:#e8a33d;
    --accent-dim:#4a3a1f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:56px 32px 96px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    margin-bottom:40px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:34px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .search{
    width:280px;
    max-width:100%;
  }
  .search input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:11px 14px;
    border-radius:6px;
    outline:none;
    transition:border-color .15s;
  }
  .search input::placeholder{color:var(--text-muted);}
  .search input:focus{border-color:var(--border-strong);}

  section.category{margin-bottom:44px;}
  .cat-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .cat-letter{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--accent);
    background:var(--accent-dim);
    padding:2px 8px;
    border-radius:4px;
  }
  .cat-title{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    margin:0;
  }
  .cat-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    margin-left:auto;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:12px;
  }
  a.card{
    display:block;
    text-decoration:none;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
    transition:border-color .15s, background .15s;
  }
  a.card:hover{
    border-color:var(--border-strong);
    background:var(--surface-hover);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
  }
  .card-title{
    font-size:14.5px;
    font-weight:500;
    margin:0 0 3px;
  }
  .card-url{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-secondary);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .empty{
    color:var(--text-muted);
    font-size:14px;
    padding:40px 0;
    text-align:center;
    display:none;
  }

  @media (max-width:600px){
    .wrap{padding:36px 18px 64px;}
    h1{font-size:26px;}
    header{align-items:flex-start;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Личная директория</p>
      <h1>Твои ссылки</h1>
    </div>
    <div class="search">
      <input id="searchInput" type="text" placeholder="Найти ссылку или категорию…">
    </div>
  </header>

  <div id="content"></div>
  <p class="empty" id="emptyState">Ничего не найдено</p>
</div>

<script>
/*
  Как добавить свои ссылки:
  Каждая категория — объект с полем name и списком links.
  У ссылки: title (название), url (адрес), url используется и как подпись.
  Порядок категорий и ссылок — как в массиве ниже.
*/
const linksData = [
  {
    name: "Работа",
    links: [
      { title: "Почта", url: "https://mail.google.com" },
      { title: "Календарь", url: "https://calendar.google.com" },
      { title: "Трекер задач", url: "https://todoist.com" },
      { title: "Диск", url: "https://drive.google.com" },
    ]
  },
  {
    name: "Инструменты",
    links: [
      { title: "GitHub", url: "https://github.com" },
      { title: "Figma", url: "https://figma.com" },
      { title: "Notion", url: "https://notion.so" },
    ]
  },
  {
    name: "Обучение",
    links: [
      { title: "Курс по SQL", url: "https://example.com/sql-course" },
      { title: "Документация", url: "https://docs.example.com" },
    ]
  },
  {
    name: "Разное",
    links: [
      { title: "Погода", url: "https://weather.com" },
      { title: "Новости", url: "https://news.example.com" },
    ]
  }
];

function letterFor(index){
  return String.fromCharCode(65 + index);
}
function codeFor(catIndex, linkIndex){
  return letterFor(catIndex) + String(linkIndex + 1).padStart(2,'0');
}
function domainOf(url){
  try{ return new URL(url).hostname.replace('www.',''); }
  catch(e){ return url; }
}

function render(filter){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();
  let totalShown = 0;

  linksData.forEach((cat, ci) => {
    const filtered = cat.links.filter(l =>
      !q || l.title.toLowerCase().includes(q) ||
      domainOf(l.url).toLowerCase().includes(q) ||
      cat.name.toLowerCase().includes(q)
    );
    if(filtered.length === 0) return;
    totalShown += filtered.length;

    const section = document.createElement('section');
    section.className = 'category';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <span class="cat-letter">${letterFor(ci)}</span>
      <h2 class="cat-title">${cat.name}</h2>
      <span class="cat-count">${filtered.length}</span>
    `;
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'grid';

    filtered.forEach((l) => {
      const originalIndex = cat.links.indexOf(l);
      const card = document.createElement('a');
      card.className = 'card';
      card.href = l.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <div class="card-top">
          <span class="code">${codeFor(ci, originalIndex)}</span>
        </div>
        <p class="card-title">${l.title}</p>
        <p class="card-url">${domainOf(l.url)}</p>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    content.appendChild(section);
  });

  document.getElementById('emptyState').style.display = totalShown === 0 ? 'block' : 'none';
}

document.getElementById('searchInput').addEventListener('input', (e) => render(e.target.value));
render('');
</script>

</body>
</html>
