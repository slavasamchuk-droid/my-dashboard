<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылки</title>
<style>
  :root{
    --bg:#f5f5f7;
    --panel:#ffffff;
    --text:#1d1d1f;
    --text-secondary:#6e6e73;
    --text-tertiary:#a1a1a6;
    --accent:#0071e3;
    --accent-soft:#e8f2fe;
    --border:rgba(0,0,0,0.06);
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
    --shadow-hover:0 2px 6px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
  }
  html[data-theme="dark"]{
    --bg:#0c0e13;
    --panel:#15181f;
    --text:#eceef0;
    --text-secondary:#9aa0a8;
    --text-tertiary:#5c6169;
    --border:rgba(255,255,255,0.08);
    --shadow:none;
    --shadow-hover:none;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  .reorder-toggle{
    position:fixed;
    top:20px;
    right:58px;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .2s, color .2s;
  }
  .reorder-toggle:hover{
    color:var(--text);
  }
  .reorder-toggle.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent);
  }

  .date-display{
    position:fixed;
    top:20px;
    left:20px;
    font-size:13px;
    color:var(--text-secondary);
    line-height:1.3;
  }
  .date-display .day{
    font-weight:600;
    color:var(--text);
  }
  .dd-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dd-sep{
    width:1px;
    align-self:stretch;
    background:var(--border-strong, var(--border));
    flex-shrink:0;
    display:none;
  }
  .dd-ticker-wrap{
    overflow:hidden;
    max-width:320px;
    position:relative;
    height:16px;
    opacity:0;
    transition:opacity .6s ease;
  }
  .dd-ticker-wrap.show{
    opacity:1;
  }
  .dd-ticker{
    display:inline-block;
    white-space:nowrap;
    font-size:12px;
    color:var(--text-secondary);
    position:absolute;
    left:0;
    top:0;
  }

  .theme-toggle{
    position:fixed;
    top:20px;
    right:20px;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .2s, color .2s;
    overflow:hidden;
  }
  .theme-toggle:hover{
    color:var(--text);
  }
  .theme-toggle .icon{
    position:absolute;
    display:flex;
    transition:transform .45s cubic-bezier(.4,0,.2,1), opacity .45s ease;
  }
  .icon-moon{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .icon-bulb{
    opacity:0;
    transform:rotate(180deg) scale(0);
  }
  html[data-theme="dark"] .icon-moon{
    opacity:0;
    transform:rotate(-180deg) scale(0);
  }
  html[data-theme="dark"] .icon-bulb{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:64px 24px 100px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  h1{
    font-size:32px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .subtitle{
    color:var(--text-secondary);
    font-size:15px;
    margin:0;
  }

  .search-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:28px;
  }
  .quick-create{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    flex-shrink:0;
    border-radius:12px;
    background:rgba(118,118,128,0.08);
    color:var(--text-secondary);
    text-decoration:none;
    transition:background .15s, color .15s;
  }
  .quick-create:hover{
    background:rgba(118,118,128,0.14);
  }
  .quick-create.sheet-btn:hover{
    color:#1e8e3e;
  }
  .quick-create.doc-btn:hover{
    color:#1a73e8;
  }
  .search-wrap{
    max-width:420px;
    width:100%;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-tertiary);
  }
  input#searchInput{
    width:100%;
    background:rgba(118,118,128,0.08);
    border:none;
    border-radius:12px;
    padding:11px 14px 11px 38px;
    font-size:15px;
    color:var(--text);
    outline:none;
    font-family:inherit;
    transition:background .15s;
  }
  input#searchInput:focus{background:rgba(118,118,128,0.14);}
  input#searchInput::placeholder{color:var(--text-tertiary);}

  section.category{margin-bottom:32px;}
  section.category.draggable{
    cursor:grab;
    border-radius:12px;
    transition:background .15s, box-shadow .15s;
    padding:8px;
    margin-left:-8px;
    margin-right:-8px;
  }
  section.category.draggable:hover{
    background:rgba(118,118,128,0.06);
  }
  section.category.dragging{
    opacity:0.4;
  }
  section.category.drag-over{
    box-shadow:0 0 0 2px var(--accent);
  }
  .drag-handle{
    color:var(--text-tertiary);
    margin-right:6px;
    display:inline-flex;
    vertical-align:-3px;
  }
  .cat-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0 0 12px;
    padding-left:4px;
    transition:color .6s ease-in-out, text-shadow .6s ease-in-out;
    text-shadow:none;
  }
  @keyframes neonWarmUp{
    0%{
      color:var(--text-secondary);
      text-shadow:none;
    }
    45%{
      color:#1b4d2e;
      text-shadow:
        0 0 2px rgba(27,77,46,0.55),
        0 0 6px rgba(27,77,46,0.45),
        0 0 12px rgba(27,77,46,0.3);
    }
    100%{
      color:#c9d558;
      text-shadow:
        0 0 3px rgba(201,213,88,0.75),
        0 0 9px rgba(201,213,88,0.55),
        0 0 18px rgba(201,213,88,0.35);
    }
  }
  section.category:has(a.pill:hover) .cat-title{
    animation:neonWarmUp 1.1s ease-in-out forwards;
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  a.pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 16px;
    font-size:14px;
    font-weight:500;
    box-shadow:var(--shadow);
    transition:transform .12s, box-shadow .12s;
  }
  a.pill:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow-hover);
    background:#1b4d2e;
    color:#ffffff;
    border-color:#1b4d2e;
  }
  a.pill:active{transform:translateY(0);}

  html[data-theme="dark"] a.pill{
    background:var(--panel);
    border:1px solid rgba(43,219,122,0.4);
    color:#4fd18a;
    box-shadow:none;
    transition:transform .12s, color .4s ease-in-out, border-color .4s ease-in-out, box-shadow .4s ease-in-out;
  }
  html[data-theme="dark"] a.pill:hover{
    color:#ff8fc9;
    border-color:#ff2d95;
    background:var(--panel);
    box-shadow:0 0 8px rgba(255,45,149,0.55), 0 0 22px rgba(255,45,149,0.35);
  }
  .favicon{
    width:20px;
    height:20px;
    border-radius:6px;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:600;
    flex-shrink:0;
  }

  .empty{
    color:var(--text-tertiary);
    font-size:14px;
    text-align:center;
    padding:48px 0;
    display:none;
  }

  .app-grid{
    display:flex;
    width:100%;
    max-width:400px;
    margin:22px auto 0;
  }
  .app-tile{
    flex:1 1 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-decoration:none;
  }
  .app-icon{
    width:28px;
    height:28px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    font-weight:600;
    font-size:10px;
    box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s;
  }
  .app-tile:hover .app-icon{
    transform:translateY(-2px) scale(1.05);
    box-shadow:var(--shadow-hover);
  }
  .app-label{
    font-size:11px;
    color:var(--text-secondary);
    text-align:center;
    line-height:1.2;
  }
  .tile-bitrix{background:#1976d2;}
  .tile-max{background:#7c4dff;}
  .tile-telegram{background:#29b6f6;}
  .tile-alio{background:#8e24aa;}
  .tile-pulse{background:#00897b;}
  .tile-amo{background:#43a047;}
  .tile-claude{background:#d97757;}
  .tile-chatgpt{background:#0f0f10;}

  @media (max-width:600px){
    .wrap{padding:44px 18px 72px;}
    h1{font-size:26px;}
    .app-grid{max-width:320px;}
  }
</style>
</head>

<script>
/*
  Как добавить свои ссылки:
  Каждая категория — объект с полем name и списком links.
  У ссылки: title (название), url (адрес) и необязательный aliases —
  список альтернативных написаний, например русскими буквами:
  { title: "Figma", url: "https://figma.com", aliases: ["фигма"] }
  По aliases тоже работает поиск, так что можно найти англоязычный
  сервис, даже если написать его название по-русски.
*/

      { title: "Аналитика лиды и креативы", url: "https://docs.google.com/spreadsheets/d/1DvKe_2r8tzeMZ17W1hH2W2LKxCSxjBH9Ho2jCvaP64w/edit?gid=116417470#gid=116417470" },

  },
  {

    links: [

      { title: "Методички", url: "https://docs.google.com/spreadsheets/d/15WCyRFhs11ofmGrFTIkuTWTrnrko3sjzI92iVB1ma2Q/edit?gid=204396947#gid=204396947" },

  {

      { title: "Мой Яндекс.Диск", url: "https://disk.yandex.ru/client/disk" },
      { title: "Мой Max", url: "https://web.max.ru/-75476892370371" },
      { title: "Тудуист", url: "https://todoist.raulpevadze.com/", aliases: ["тудуист"] },
    ]
  }
];

function initialOf(title){
  return title.trim().charAt(0).toUpperCase();
}

const ORDER_KEY = 'dashboardCategoryOrder';
let reorderMode = false;
let currentQuery = '';
let draggedName = null;

function applySavedOrder(){
  try{
    const saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
    if(Array.isArray(saved) && saved.length){
      linksData.sort((a, b) => saved.indexOf(a.name) - saved.indexOf(b.name));
    }
  }catch(e){}
}

function saveOrder(){
  try{
    localStorage.setItem(ORDER_KEY, JSON.stringify(linksData.map(c => c.name)));
  }catch(e){}
}

function moveCategory(fromName, toName){
  if(fromName === toName) return;
  const fromIndex = linksData.findIndex(c => c.name === fromName);
  const toIndex = linksData.findIndex(c => c.name === toName);
  if(fromIndex === -1 || toIndex === -1) return;
  const [moved] = linksData.splice(fromIndex, 1);
  linksData.splice(toIndex, 0, moved);
  saveOrder();
}

function render(filter){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();
  let totalShown = 0;

  linksData.forEach((cat) => {
    const filtered = cat.links.filter(l =>
      !q || l.title.toLowerCase().startsWith(q) ||
      cat.name.toLowerCase().startsWith(q) ||
      (l.aliases || []).some(a => a.toLowerCase().startsWith(q))
    );
    if(filtered.length === 0) return;
    totalShown += filtered.length;

    const section = document.createElement('section');
    section.className = 'category';
    section.dataset.cat = cat.name;

    const head = document.createElement('p');
    head.className = 'cat-title';
    head.innerHTML = reorderMode
      ? `<span class="drag-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"></circle><circle cx="16" cy="6" r="1.6"></circle><circle cx="8" cy="12" r="1.6"></circle><circle cx="16" cy="12" r="1.6"></circle><circle cx="8" cy="18" r="1.6"></circle><circle cx="16" cy="18" r="1.6"></circle></svg></span>${cat.name}`
      : cat.name;
    section.appendChild(head);

    if(reorderMode){
      section.classList.add('draggable');
      section.draggable = true;
      section.addEventListener('dragstart', () => {
        draggedName = cat.name;
        section.classList.add('dragging');
      });
      section.addEventListener('dragend', () => {
        section.classList.remove('dragging');
      });
      section.addEventListener('dragover', (e) => {
        e.preventDefault();
        section.classList.add('drag-over');
      });
      section.addEventListener('dragleave', () => {
        section.classList.remove('drag-over');
      });
      section.addEventListener('drop', (e) => {
        e.preventDefault();
        section.classList.remove('drag-over');
        if(draggedName){
          moveCategory(draggedName, cat.name);
          draggedName = null;
          render(currentQuery);
        }
      });
    }

    const pills = document.createElement('div');
    pills.className = 'pills';

    filtered.forEach((l) => {
      const pill = document.createElement('a');
      pill.className = 'pill';
      pill.href = l.url;
      pill.target = '_blank';
      pill.rel = 'noopener noreferrer';
      pill.innerHTML = `<span>${l.title}</span>`;
      pills.appendChild(pill);
    });

    section.appendChild(pills);
    content.appendChild(section);
  });

  document.getElementById('emptyState').style.display = totalShown === 0 ? 'block' : 'none';
}

applySavedOrder();

function renderDate(){
  const el = document.getElementById('ddDate');
  const now = new Date();
  const weekday = now.toLocaleDateString('ru-RU', { weekday: 'long' });
  const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const weekdayCap = weekday.charAt(0).toUpperCase() + weekday.slice(1);
  el.innerHTML = `<span class="day">${weekdayCap}</span><br>${dateStr}<br>${timeStr}`;
}
renderDate();
setInterval(renderDate, 30000);

/*
  Дорожная карта: читает лист "Активности" (гид 147658334) через
  публичный gviz-эндпоинт (без API-ключа, работает если у таблицы
  открыт доступ "по ссылке"). Ищет ячейки с маркером "!" в сетке
  дат, вычисляет дату по шапке (месяц + число) и берёт название
  события из колонки A или B той же строки.
*/
const ROADMAP_SHEET_ID = '1kLE3EIPY51yNDf8u-cM5rCIinrrjpAJ1egthysZcQrs';
const ROADMAP_GID = '147658334';
const ROADMAP_MARKER = '!';
const RU_MONTHS = {
  'январь':0,'февраль':1,'март':2,'апрель':3,'май':4,'июнь':5,
  'июль':6,'август':7,'сентябрь':8,'октябрь':9,'ноябрь':10,'декабрь':11
};

function pluralDays(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return 'дней';
  if(mod10 === 1) return 'день';
  if(mod10 >= 2 && mod10 <= 4) return 'дня';
  return 'дней';
}

function findMonthIndex(cellText){
  if(!cellText) return null;
  const t = cellText.toString().trim().toLowerCase();
  for(const name in RU_MONTHS){
    if(t.startsWith(name)) return RU_MONTHS[name];
  }
  return null;
}

function handleRoadmapData(resp){
  try{
    const rows = resp.table.rows.map(r => (r.c || []).map(c => (c && (c.f || c.v) != null) ? String(c.f || c.v) : ''));
    if(!rows.length) return;

    let monthRow = -1;
    for(let i = 0; i < rows.length; i++){
      if(rows[i].some(cell => findMonthIndex(cell) !== null)){ monthRow = i; break; }
    }
    if(monthRow === -1) return;
    const dayRow = monthRow + 1;
    if(!rows[dayRow]) return;

    const today = new Date();
    today.setHours(0,0,0,0);
    const baseYear = today.getFullYear();

    const colDate = {};
    let curMonth = null, year = baseYear, prevMonth = null, prevDay = null;
    for(let c = 0; c < rows[monthRow].length; c++){
      const labelMonth = findMonthIndex(rows[monthRow][c]);
      const dayVal = parseInt(rows[dayRow][c], 10);
      if(isNaN(dayVal)){ prevDay = null; continue; }

      if(labelMonth !== null){
        curMonth = labelMonth;
      } else if(curMonth !== null && prevDay !== null && dayVal < prevDay){
        curMonth = (curMonth + 1) % 12;
      }
      if(curMonth === null){ prevDay = dayVal; continue; }

      if(prevMonth !== null && curMonth < prevMonth) year++;
      prevMonth = curMonth;
      prevDay = dayVal;
      colDate[c] = new Date(year, curMonth, dayVal);
    }

    let dataStart = dayRow + 1;
    while(dataStart < rows.length && !rows[dataStart][0] && !rows[dataStart][1]) dataStart++;

    const matches = [];
    for(let r = dataStart; r < rows.length; r++){
      const row = rows[r];
      if(!row) continue;
      const name = (row[0] && row[0].trim()) || (row[1] && row[1].trim());
      if(!name) continue;
      for(let c = 2; c < row.length; c++){
        if(row[c] && row[c].trim() === ROADMAP_MARKER && colDate[c]){
          matches.push({ name, date: colDate[c] });
        }
      }
    }

    const upcoming = matches
      .filter(m => m.date >= today)
      .sort((a, b) => a.date - b.date);

    if(upcoming.length){
      tickerMessages = upcoming.map(m => {
        const days = Math.round((m.date - today) / 86400000);
        return `До мероприятия «${m.name}» осталось ${days} ${pluralDays(days)}`;
      });
      document.getElementById('ddSep').style.display = 'block';
      showNextTicker();
    }
  }catch(e){
    /* тихо ничего не показываем, если структура таблицы не совпала */
  }
}

let tickerMessages = [];
let tickerIndex = 0;

function showNextTicker(){
  if(!tickerMessages.length) return;
  const wrap = document.getElementById('ddTickerWrap');
  const el = document.getElementById('ddTicker');

  el.style.transition = 'none';
  el.style.transform = 'translateX(0)';
  el.textContent = tickerMessages[tickerIndex];

  requestAnimationFrame(() => {
    wrap.classList.add('show');
    const overflow = el.scrollWidth - wrap.clientWidth;

    const finish = () => {
      wrap.classList.remove('show');
      setTimeout(() => {
        tickerIndex = (tickerIndex + 1) % tickerMessages.length;
        showNextTicker();
      }, 600);
    };

    if(overflow > 0){
      const scrollDuration = Math.max(2, overflow / 40);
      setTimeout(() => {
        el.style.transition = `transform ${scrollDuration}s linear`;
        el.style.transform = `translateX(-${overflow}px)`;
      }, 700);
      setTimeout(finish, 5000 + scrollDuration * 1000);
    } else {
      setTimeout(finish, 5000);
    }
  });
}

function loadRoadmap(){
  window.google = window.google || {};
  window.google.visualization = window.google.visualization || {};
  window.google.visualization.Query = window.google.visualization.Query || {};
  window.google.visualization.Query.setResponse = window.google.visualization.Query.setResponse || function(resp){ handleRoadmapData(resp); };
  const script = document.createElement('script');
  script.src = `https://docs.google.com/spreadsheets/d/${ROADMAP_SHEET_ID}/gviz/tq?gid=${ROADMAP_GID}&headers=0&tqx=out:json;responseHandler:handleRoadmapData`;
  script.onerror = () => {};
  document.body.appendChild(script);
}
loadRoadmap();

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentQuery = e.target.value;
  render(currentQuery);
});
render('');

themeToggle.addEventListener('click', () => {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
});

const reorderToggle = document.getElementById('reorderToggle');
reorderToggle.addEventListener('click', () => {
  reorderMode = !reorderMode;
  reorderToggle.classList.toggle('active', reorderMode);
  render(currentQuery);
});
</script>
