<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылки</title>
<style>
  :root{
    --bg:#f5f5f7;
    --panel:#ffffff;
    --text:#1d1d1f;
    --text-secondary:#6e6e73;
    --text-tertiary:#a1a1a6;
    --accent:#0071e3;
    --accent-soft:#e8f2fe;
    --border:rgba(0,0,0,0.06);
    --shadow:0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
    --shadow-hover:0 2px 6px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
  }
  html[data-theme="dark"]{
    --bg:#0c0e13;
    --panel:#15181f;
    --text:#eceef0;
    --text-secondary:#9aa0a8;
    --text-tertiary:#5c6169;
    --border:rgba(255,255,255,0.08);
    --shadow:none;
    --shadow-hover:none;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  .sync-bar{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-tertiary);
    margin-bottom:24px;
  }
  .sync-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#34c759;
    flex-shrink:0;
  }
  .sync-dot.syncing{
    background:#d9b357;
    animation:sync-pulse 1s ease-in-out infinite;
  }
  .sync-dot.error{
    background:#ff3b30;
  }
  @keyframes sync-pulse{
    0%,100%{opacity:1;}
    50%{opacity:.35;}
  }
  .sync-refresh{
    border:none;
    background:transparent;
    color:var(--text-tertiary);
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:3px;
    border-radius:5px;
    transition:color .15s, background .15s, transform .4s;
  }
  .sync-refresh:hover{
    color:var(--text);
    background:rgba(118,118,128,0.08);
  }
  .sync-refresh.spinning svg{
    animation:sync-spin .7s linear infinite;
  }
  @keyframes sync-spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  .top-bar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:24px;
  }
  .settings-wrap{
    position:relative;
  }
  .settings-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
    padding:6px;
    min-width:240px;
    max-height:70vh;
    overflow-y:auto;
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    z-index:100;
  }
  .settings-menu.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .settings-menu a{
    display:block;
    padding:8px 12px;
    color:var(--text);
    text-decoration:none;
    border-radius:8px;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:background .12s;
  }
  .settings-menu a:hover{
    background:rgba(118,118,128,0.08);
  }

  .top-bar-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .reorder-toggle{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .2s, color .2s;
  }
  .reorder-toggle:hover{
    color:var(--text);
  }
  .reorder-toggle.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent);
  }

  .date-display{
    font-size:13px;
    color:var(--text-secondary);
    line-height:1.3;
  }
  .date-display .day{
    font-weight:600;
    color:var(--text);
  }
  .dd-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dd-sep{
    width:1px;
    align-self:stretch;
    background:var(--border-strong, var(--border));
    flex-shrink:0;
    display:none;
  }
  .dd-ticker-wrap{
    overflow:hidden;
    width:480px;
    position:relative;
    height:16px;
    opacity:0;
    transition:opacity .6s ease;
  }
  .dd-ticker-wrap.show{
    opacity:1;
  }
  .dd-actions{
    display:flex;
    gap:6px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  button.dd-action-plan-link{
    font-family:inherit;
    cursor:pointer;
  }
  .events-panel{
    display:none;
    margin-top:8px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    max-height:280px;
    overflow-y:auto;
    font-size:12px;
    color:var(--text-secondary);
    box-shadow:var(--shadow);
    max-width:340px;
  }
  .events-panel.open{
    display:block;
  }
  .events-panel .event-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:5px 0;
    border-bottom:1px solid var(--border);
  }
  .events-panel .event-row:last-child{
    border-bottom:none;
  }
  .events-panel .event-row.past{
    opacity:0.45;
  }
  .events-panel .event-name{
    color:var(--text);
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .events-panel .event-row.past .event-name{
    color:var(--text-secondary);
  }
  .events-panel .event-date{
    color:var(--text-tertiary);
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .events-panel .empty-hint{
    color:var(--text-tertiary);
    font-style:italic;
    padding:4px 0;
  }

  .dd-action-plan-link{
    display:inline-flex;
    align-items:center;
    gap:4px;
    margin-top:6px;
    font-size:10px;
    color:var(--text-tertiary);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 6px;
    transition:color .15s, border-color .15s, background .15s;
  }
  .dd-action-plan-link:hover{
    color:var(--text);
    border-color:var(--border-strong, var(--text-tertiary));
    background:rgba(118,118,128,0.08);
  }
  .dd-ticker{
    display:inline-block;
    white-space:nowrap;
    font-size:12px;
    color:var(--text-secondary);
    position:absolute;
    left:0;
    top:0;
  }

  .theme-toggle{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .2s, color .2s;
    overflow:hidden;
  }
  .theme-toggle:hover{
    color:var(--text);
  }
  .theme-toggle .icon{
    position:absolute;
    display:flex;
    transition:transform .45s cubic-bezier(.4,0,.2,1), opacity .45s ease;
  }
  .icon-moon{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .icon-bulb{
    opacity:0;
    transform:rotate(180deg) scale(0);
  }
  html[data-theme="dark"] .icon-moon{
    opacity:0;
    transform:rotate(-180deg) scale(0);
  }
  html[data-theme="dark"] .icon-bulb{
    opacity:1;
    transform:rotate(0deg) scale(1);
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:64px 24px 100px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  h1{
    font-size:32px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .subtitle{
    color:var(--text-secondary);
    font-size:15px;
    margin:0;
  }

  .search-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:28px;
  }
  .quick-create{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    flex-shrink:0;
    border-radius:12px;
    background:rgba(118,118,128,0.08);
    color:var(--text-secondary);
    text-decoration:none;
    transition:background .15s, color .15s;
  }
  .quick-create:hover{
    background:rgba(118,118,128,0.14);
  }
  .quick-create.sheet-btn:hover{
    color:#1e8e3e;
  }
  .quick-create.doc-btn:hover{
    color:#1a73e8;
  }
  .search-wrap{
    max-width:420px;
    width:100%;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-tertiary);
  }
  input#searchInput{
    width:100%;
    background:rgba(118,118,128,0.08);
    border:none;
    border-radius:12px;
    padding:11px 14px 11px 38px;
    font-size:15px;
    color:var(--text);
    outline:none;
    font-family:inherit;
    transition:background .15s;
  }
  input#searchInput:focus{background:rgba(118,118,128,0.14);}
  input#searchInput::placeholder{color:var(--text-tertiary);}

  section.category{margin-bottom:32px;}
  section.category.draggable{
    cursor:grab;
    border-radius:12px;
    transition:background .15s, box-shadow .15s;
    padding:8px;
    margin-left:-8px;
    margin-right:-8px;
  }
  section.category.draggable:hover{
    background:rgba(118,118,128,0.06);
  }
  section.category.dragging{
    opacity:0.4;
  }
  section.category.drag-over{
    box-shadow:0 0 0 2px var(--accent);
  }
  .drag-handle{
    color:var(--text-tertiary);
    margin-right:6px;
    display:inline-flex;
    vertical-align:-3px;
  }
  .cat-title{
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0 0 12px;
    padding-left:4px;
    transition:color .6s ease-in-out, text-shadow .6s ease-in-out;
    text-shadow:none;
  }
  @keyframes neonWarmUp{
    0%{
      color:var(--text-secondary);
      text-shadow:none;
    }
    45%{
      color:#1b4d2e;
      text-shadow:
        0 0 2px rgba(27,77,46,0.55),
        0 0 6px rgba(27,77,46,0.45),
        0 0 12px rgba(27,77,46,0.3);
    }
    100%{
      color:#c9d558;
      text-shadow:
        0 0 3px rgba(201,213,88,0.75),
        0 0 9px rgba(201,213,88,0.55),
        0 0 18px rgba(201,213,88,0.35);
    }
  }
  section.category:has(a.pill:hover) .cat-title{
    animation:neonWarmUp 1.1s ease-in-out forwards;
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  a.pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 16px;
    font-size:14px;
    font-weight:500;
    box-shadow:var(--shadow);
    transition:transform .12s, box-shadow .12s;
  }
  a.pill:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow-hover);
    background:#1b4d2e;
    color:#ffffff;
    border-color:#1b4d2e;
  }
  a.pill:active{transform:translateY(0);}

  html[data-theme="dark"] a.pill{
    background:var(--panel);
    border:1px solid rgba(43,219,122,0.4);
    color:#4fd18a;
    box-shadow:none;
    transition:transform .12s, color .4s ease-in-out, border-color .4s ease-in-out, box-shadow .4s ease-in-out;
  }
  html[data-theme="dark"] a.pill:hover{
    color:#ff8fc9;
    border-color:#ff2d95;
    background:var(--panel);
    box-shadow:0 0 8px rgba(255,45,149,0.55), 0 0 22px rgba(255,45,149,0.35);
  }

  .empty{
    color:var(--text-tertiary);
    font-size:14px;
    text-align:center;
    padding:48px 0;
    display:none;
  }

  .app-grid{
    display:flex;
    width:100%;
    max-width:400px;
    margin:22px auto 0;
  }
  .app-tile{
    flex:1 1 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-decoration:none;
  }
  .app-icon{
    width:28px;
    height:28px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    font-weight:600;
    font-size:10px;
    box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s;
  }
  .app-tile:hover .app-icon{
    transform:translateY(-2px) scale(1.05);
    box-shadow:var(--shadow-hover);
  }
  .app-label{
    font-size:11px;
    color:var(--text-secondary);
    text-align:center;
    line-height:1.2;
  }
  .tile-bitrix{background:#1976d2;}
  .tile-max{background:#7c4dff;}
  .tile-telegram{background:#29b6f6;}
  .tile-alio{background:#8e24aa;}
  .tile-pulse{background:#00897b;}
  .tile-amo{background:#43a047;}
  .tile-claude{background:#d97757;}
  .tile-chatgpt{background:#0f0f10;}

  @media (max-width:600px){
    .wrap{padding:44px 18px 72px;}
    h1{font-size:26px;}
    .app-grid{max-width:320px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="date-display" id="dateDisplay">
      <div class="dd-row">
        <div id="ddDate"></div>
        <div class="dd-sep" id="ddSep"></div>
        <div class="dd-ticker-wrap" id="ddTickerWrap"><span class="dd-ticker" id="ddTicker"></span></div>
      </div>
      <div class="dd-actions">
        <a class="dd-action-plan-link" href="https://docs.google.com/spreadsheets/d/1kLE3EIPY51yNDf8u-cM5rCIinrrjpAJ1egthysZcQrs/edit?gid=147658334#gid=147658334" target="_blank" rel="noopener noreferrer">
          Смотреть экшн план
        </a>
        <button class="dd-action-plan-link" id="eventsListBtn" type="button">

      <div class="events-panel" id="eventsPanel"></div>
    </div>

    <div class="top-bar-actions">

        </button>
        <div class="settings-menu" id="settingsMenu"></div>
      </div>

      <button class="reorder-toggle" id="reorderToggle" title="Изменить порядок разделов" aria-label="Изменить порядок разделов">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
      </button>

      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <span class="icon icon-moon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
        </span>
        <span class="icon icon-bulb">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="10" r="4.5"></circle>
            <path d="M10 7.7 Q8.3 9 8.6 11.8"></path>
            <path d="M9.3 15.5h5.4"></path>
            <path d="M9.6 17h4.8"></path>
            <path d="M10 18.5h4"></path>
            <line x1="12" y1="3.5" x2="12" y2="1"></line>
            <line x1="16.6" y1="5.4" x2="18.4" y2="3.6"></line>
            <line x1="18.5" y1="10" x2="21" y2="10"></line>
            <line x1="16.6" y1="14.6" x2="18.4" y2="16.4"></line>
            <line x1="7.4" y1="14.6" x2="5.6" y2="16.4"></line>
            <line x1="5.5" y1="10" x2="3" y2="10"></line>
            <line x1="7.4" y1="5.4" x2="5.6" y2="3.6"></line>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <div class="sync-bar">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">Загрузка…</span>
    <button class="sync-refresh" id="syncRefresh" title="Обновить сейчас" aria-label="Обновить сейчас">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0114.13-3.36L23 10M1 14l5.36 4.36A9 9 0 0020.49 15"></path></svg>
    </button>
  </div>

  <header>
    <div class="search-row">
      <a class="quick-create sheet-btn" href="https://sheets.new" target="_blank" rel="noopener noreferrer" title="Создать Google Таблицу" aria-label="Создать Google Таблицу">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
      </a>
      <a class="quick-create doc-btn" href="https://docs.new" target="_blank" rel="noopener noreferrer" title="Создать Google Документ" aria-label="Создать Google Документ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>
      </a>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="searchInput" type="text" placeholder="Поиск ссылки">
      </div>
    </div>

    <div class="app-grid">
      <a class="app-tile" href="https://marketing93.bitrix24.ru/stream/" target="_blank" rel="noopener noreferrer" title="Битрикс24">
        <span class="app-icon tile-bitrix">Б</span>
        <span class="app-label">Битрикс</span>
      </a>
      <a class="app-tile" href="https://web.max.ru/-75476892370371" target="_blank" rel="noopener noreferrer" title="Max">
        <span class="app-icon tile-max">M</span>

<script>
/*
  Как добавить свои ссылки:
  Каждая категория — объект с полем name и списком links.
  У ссылки: title (название), url (адрес) и необязательный aliases —
  список альтернативных написаний, например русскими буквами:
  { title: "Figma", url: "https://figma.com", aliases: ["фигма"] }
  По aliases тоже работает поиск, так что можно найти англоязычный
  сервис, даже если написать его название по-русски.
*/
/*
  Ссылки теперь читаются напрямую из Google Таблицы "Ссылки для дашборда":
  https://docs.google.com/spreadsheets/d/1xM2j5tKaIIN-nFhj9z9uNU1-1u3pQFflHJBslLlHI00/edit
  Колонки: category, title, url — просто добавляй новую строку в таблицу,
  категория группируется автоматически по первому столбцу.
*/
let linksData = [];

const ORDER_KEY = 'dashboardCategoryOrder';
let reorderMode = false;
let currentQuery = '';
let draggedName = null;

const FIREBASE_URL = 'https://slava-22b68-default-rtdb.firebaseio.com';
let syncCount = 0;

async function fbGet(path){
  const r = await fetch(`${FIREBASE_URL}/${path}.json`);
  if(!r.ok) throw new Error('Firebase GET ' + r.status);
  return r.json();
}
async function fbPut(path, value){
  const r = await fetch(`${FIREBASE_URL}/${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(value)
  });
  if(!r.ok) throw new Error('Firebase PUT ' + r.status);
  return r.json();
}

function updateSyncBar(state){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(!dot || !text) return;
  if(state === 'syncing'){
    dot.className = 'sync-dot syncing';
    text.textContent = 'Синхронизация…';
    return;
  }
  if(state === 'error'){
    dot.className = 'sync-dot error';
    text.textContent = 'Не удалось синхронизировать';
    return;
  }
  dot.className = 'sync-dot';
  const totalLinks = linksData.reduce((sum, c) => sum + c.links.length, 0);
  const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  text.textContent = `${totalLinks} ссылки · разделов: ${linksData.length} · синк #${syncCount} · синхронизировано в ${time}`;
}

async function syncDashboard(){
  updateSyncBar('syncing');
  try{
    let count = 0;
    try{ count = (await fbGet('dashboard/syncCount')) || 0; }catch(e){}
    count += 1;
    syncCount = count;
    await fbPut('dashboard/syncCount', count);
    await fbPut('dashboard/order', linksData.map(c => c.name));
    await fbPut('dashboard/lastSync', new Date().toISOString());
    console.log('[firebase] синхронизация #' + count + ' выполнена');
    updateSyncBar('done');
  }catch(e){
    console.error('[firebase] ошибка синхронизации:', e);
    updateSyncBar('error');
  }
}

async function loadOrderFromFirebase(){
  try{
    const saved = await fbGet('dashboard/order');
    if(Array.isArray(saved) && saved.length){
      linksData.sort((a, b) => saved.indexOf(a.name) - saved.indexOf(b.name));
      render(currentQuery);
    }
    try{ syncCount = (await fbGet('dashboard/syncCount')) || 0; }catch(e){}
  }catch(e){
    console.warn('[firebase] не удалось получить порядок из облака, использую локальный:', e);
  }
  updateSyncBar('done');
}

function applySavedOrder(){
  try{
    const saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
    if(Array.isArray(saved) && saved.length){
      linksData.sort((a, b) => saved.indexOf(a.name) - saved.indexOf(b.name));
    }
  }catch(e){}
}

function saveOrder(){
  try{
    localStorage.setItem(ORDER_KEY, JSON.stringify(linksData.map(c => c.name)));
  }catch(e){}
  syncDashboard();
}

function moveCategory(fromName, toName){
  if(fromName === toName) return;
  const fromIndex = linksData.findIndex(c => c.name === fromName);
  const toIndex = linksData.findIndex(c => c.name === toName);
  if(fromIndex === -1 || toIndex === -1) return;
  const [moved] = linksData.splice(fromIndex, 1);
  linksData.splice(toIndex, 0, moved);
  saveOrder();
}

function render(filter){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();
  let totalShown = 0;

  linksData.forEach((cat) => {
    const filtered = cat.links.filter(l =>
      !q || l.title.toLowerCase().startsWith(q) ||
      cat.name.toLowerCase().startsWith(q) ||
      (l.aliases || []).some(a => a.toLowerCase().startsWith(q))
    );
    if(filtered.length === 0) return;
    totalShown += filtered.length;

    const section = document.createElement('section');
    section.className = 'category';
    section.dataset.cat = cat.name;

    const head = document.createElement('p');
    head.className = 'cat-title';
    head.innerHTML = reorderMode
      ? `<span class="drag-handle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"></circle><circle cx="16" cy="6" r="1.6"></circle><circle cx="8" cy="12" r="1.6"></circle><circle cx="16" cy="12" r="1.6"></circle><circle cx="8" cy="18" r="1.6"></circle><circle cx="16" cy="18" r="1.6"></circle></svg></span>${cat.name}`
      : cat.name;
    section.appendChild(head);

    if(reorderMode){
      section.classList.add('draggable');
      section.draggable = true;
      section.addEventListener('dragstart', () => {
        draggedName = cat.name;
        section.classList.add('dragging');
      });
      section.addEventListener('dragend', () => {
        section.classList.remove('dragging');
      });
      section.addEventListener('dragover', (e) => {
        e.preventDefault();
        section.classList.add('drag-over');
      });
      section.addEventListener('dragleave', (e) => {
        if(!section.contains(e.relatedTarget)){
          section.classList.remove('drag-over');
        }
      });
      section.addEventListener('drop', (e) => {
        e.preventDefault();
        section.classList.remove('drag-over');
        if(draggedName){
          moveCategory(draggedName, cat.name);
          draggedName = null;
          render(currentQuery);
        }
      });
    }

    const pills = document.createElement('div');
    pills.className = 'pills';

    filtered.forEach((l) => {
      const pill = document.createElement('a');
      pill.className = 'pill';
      pill.href = l.url;
      pill.target = '_blank';
      pill.rel = 'noopener noreferrer';
      pill.innerHTML = `<span>${l.title}</span>`;
      pills.appendChild(pill);
    });

    section.appendChild(pills);
    content.appendChild(section);
  });

  document.getElementById('emptyState').style.display = totalShown === 0 ? 'block' : 'none';
}

applySavedOrder();

/*
  Дорожная карта: читает лист "Активности" (гид 147658334) через
  публичный gviz-эндпоинт (без API-ключа, работает если у таблицы
  открыт доступ "по ссылке"). Ищет ячейки с маркером "!" в сетке
  дат, вычисляет дату по шапке (месяц + число) и берёт название
  события из колонки A или B той же строки.
*/
const ROADMAP_SHEET_ID = '1kLE3EIPY51yNDf8u-cM5rCIinrrjpAJ1egthysZcQrs';
const ROADMAP_GID = '147658334';
const ROADMAP_MARKER = '!';
const RU_MONTHS = {
  'январь':0,'февраль':1,'март':2,'апрель':3,'май':4,'июнь':5,
  'июль':6,'август':7,'сентябрь':8,'октябрь':9,'ноябрь':10,'декабрь':11
};

function pluralDays(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return 'дней';
  if(mod10 === 1) return 'день';
  if(mod10 >= 2 && mod10 <= 4) return 'дня';
  return 'дней';
}

function pluralMonths(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return 'месяцев';
  if(mod10 === 1) return 'месяц';
  if(mod10 >= 2 && mod10 <= 4) return 'месяца';
  return 'месяцев';
}

function formatRemaining(today, eventDate){
  const totalDays = Math.round((eventDate - today) / 86400000);
  if(totalDays < 15){
    return `${totalDays} ${pluralDays(totalDays)}`;
  }
  let months = (eventDate.getFullYear() - today.getFullYear()) * 12 + (eventDate.getMonth() - today.getMonth());
  let days = eventDate.getDate() - today.getDate();
  if(days < 0){
    months--;
    const prevMonthLastDay = new Date(eventDate.getFullYear(), eventDate.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if(months <= 0){
    return `${totalDays} ${pluralDays(totalDays)}`;
  }
  if(days === 0){
    return `${months} ${pluralMonths(months)}`;
  }
  return `${months} ${pluralMonths(months)} и ${days} ${pluralDays(days)}`;
}

function formatEventDate(d){
  const day = d.getDate();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  return `${day}.${month}.${year}`;
}

function findMonthIndex(cellText){
  if(!cellText) return null;
  const t = cellText.toString().trim().toLowerCase();
  for(const name in RU_MONTHS){
    if(t.startsWith(name)) return RU_MONTHS[name];
  }
  return null;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field = ''; }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(ch === '\r'){ /* пропускаем */ }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function processRoadmapCSV(text){
  try{
    const rows = parseCSV(text);
    console.log('[roadmap] всего строк:', rows.length);
    if(!rows.length) return;

    let monthRow = -1;
    for(let i = 0; i < rows.length; i++){
      if(rows[i].some(cell => findMonthIndex(cell) !== null)){ monthRow = i; break; }
    }
    if(monthRow === -1){ console.error('[roadmap] не нашёл строку с названием месяца'); return; }
    const dayRow = monthRow + 1;
    if(!rows[dayRow]){ console.error('[roadmap] нет строки с числами дней после строки месяцев'); return; }
    console.log('[roadmap] строка месяцев:', monthRow, 'строка дней:', dayRow);

    const today = new Date();
    today.setHours(0,0,0,0);
    const baseYear = today.getFullYear();

    const colDate = {};
    let curMonth = null, year = baseYear, prevMonth = null, prevDay = null;
    for(let c = 0; c < rows[monthRow].length; c++){
      const labelMonth = findMonthIndex(rows[monthRow][c]);
      const dayVal = parseInt(rows[dayRow][c], 10);
      if(isNaN(dayVal)){ prevDay = null; continue; }

      if(labelMonth !== null){
        curMonth = labelMonth;
      } else if(curMonth !== null && prevDay !== null && dayVal < prevDay){
        curMonth = (curMonth + 1) % 12;
      }
      if(curMonth === null){ prevDay = dayVal; continue; }

      if(prevMonth !== null && curMonth < prevMonth) year++;
      prevMonth = curMonth;
      prevDay = dayVal;
      colDate[c] = new Date(year, curMonth, dayVal);
    }

    let dataStart = dayRow + 1;
    while(dataStart < rows.length && !rows[dataStart][0] && !rows[dataStart][1]) dataStart++;

    const matches = [];
    for(let r = dataStart; r < rows.length; r++){
      const row = rows[r];
      if(!row) continue;
      const name = (row[0] && row[0].trim()) || (row[1] && row[1].trim());
      if(!name) continue;
      for(let c = 2; c < row.length; c++){
        if(row[c] && row[c].includes(ROADMAP_MARKER) && colDate[c]){
          matches.push({ name, date: colDate[c] });
        }
      }
    }

    console.log('[roadmap] начало данных со строки:', dataStart, '/ найдено маркеров "!":', matches.length, matches);

    allEvents = matches.sort((a, b) => a.date - b.date);
    populateEventsPanel();

    const upcoming = matches
      .filter(m => m.date >= today)
      .sort((a, b) => a.date - b.date);

    console.log('[roadmap] будущих событий:', upcoming.length, upcoming);

    if(upcoming.length){
      tickerMessages = upcoming.map(m => {
        return `До мероприятия «${m.name}» осталось ${formatRemaining(today, m.date)} · ${formatEventDate(m.date)}`;
      });
      console.log('[roadmap] сообщения тикера:', tickerMessages);
      document.getElementById('ddSep').style.display = 'block';
      showNextTicker();
    } else {
      console.warn('[roadmap] маркеры есть, но все даты в прошлом либо не распознаны');
    }
  }catch(e){
    console.error('[roadmap] ошибка разбора:', e);
  }
}

let tickerMessages = [];
let allEvents = [];

function populateEventsPanel(){
  const panel = document.getElementById('eventsPanel');
  if(!panel) return;
  panel.innerHTML = '';
  if(!allEvents.length){
    panel.innerHTML = '<div class="empty-hint">Нет отмеченных мероприятий</div>';
    return;
  }
  const today = new Date();
  today.setHours(0,0,0,0);
  allEvents.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'event-row' + (ev.date < today ? ' past' : '');
    const name = document.createElement('span');
    name.className = 'event-name';
    name.textContent = ev.name;
    const date = document.createElement('span');
    date.className = 'event-date';
    date.textContent = formatEventDate(ev.date);
    row.appendChild(name);
    row.appendChild(date);
    panel.appendChild(row);
  });
}
let tickerIndex = 0;

function showNextTicker(){
  if(!tickerMessages.length) return;
  const wrap = document.getElementById('ddTickerWrap');
  const el = document.getElementById('ddTicker');

  el.style.transition = 'none';
  el.style.transform = 'translateX(0)';
  el.textContent = tickerMessages[tickerIndex];

  requestAnimationFrame(() => {
    wrap.classList.add('show');
    const overflow = el.scrollWidth - wrap.clientWidth;

    const finish = () => {
      wrap.classList.remove('show');
      setTimeout(() => {
        tickerIndex = (tickerIndex + 1) % tickerMessages.length;
        showNextTicker();
      }, 600);
    };

    if(overflow > 0){
      const scrollDuration = Math.max(2, overflow / 40);
      setTimeout(() => {
        el.style.transition = `transform ${scrollDuration}s linear`;
        el.style.transform = `translateX(-${overflow}px)`;
      }, 700);
      setTimeout(finish, 5000 + scrollDuration * 1000);
    } else {
      setTimeout(finish, 5000);
    }
  });
}

function loadRoadmap(){
  window.google = window.google || {};
  window.google.visualization = window.google.visualization || {};
  window.google.visualization.Query = window.google.visualization.Query || {};
  window.google.visualization.Query.setResponse = function(resp){
    console.log('[roadmap] получен ответ от таблицы:', resp);
    if(!resp || resp.status !== 'ok'){
      console.error('[roadmap] таблица вернула ошибку:', resp && (resp.errors || resp.status));
      return;
    }
    const rows = resp.table.rows.map(r => (r.c || []).map(c => (c && (c.f || c.v) != null) ? String(c.f || c.v) : ''));
    const csvLike = rows.map(r => r.map(v => `"${(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    processRoadmapCSV(csvLike);
  };

  const oldScript = document.getElementById('roadmap-loader-script');
  if(oldScript) oldScript.remove();

  const script = document.createElement('script');
  script.id = 'roadmap-loader-script';
  script.src = `https://docs.google.com/spreadsheets/d/${ROADMAP_SHEET_ID}/gviz/tq?gid=${ROADMAP_GID}&headers=0&tqx=out:json`;
  console.log('[roadmap] загружаю (JSONP):', script.src);
  let loaded = false;
  script.onload = () => { loaded = true; console.log('[roadmap] скрипт загружен успешно'); };
  script.onerror = (e) => {
    console.error('[roadmap] скрипт НЕ загрузился, пробую через CSV+прокси:', e);
    fetchRoadmapViaProxy();
  };
  document.body.appendChild(script);
  setTimeout(() => { if(!loaded){ console.warn('[roadmap] таймаут JSONP, пробую CSV+прокси'); fetchRoadmapViaProxy(); } }, 4000);
}

function fetchRoadmapViaProxy(){
  const csvUrl = `https://docs.google.com/spreadsheets/d/${ROADMAP_SHEET_ID}/export?format=csv&gid=${ROADMAP_GID}`;
  const proxied = `https://corsproxy.io/?${encodeURIComponent(csvUrl)}`;
  console.log('[roadmap] fallback fetch:', proxied);
  fetch(proxied)
    .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(text => { console.log('[roadmap] fallback ok, символов:', text.length); processRoadmapCSV(text); })
    .catch(e => console.error('[roadmap] fallback тоже упал:', e));
}

const LINKS_SHEET_ID = '1xM2j5tKaIIN-nFhj9z9uNU1-1u3pQFflHJBslLlHI00';
const LINKS_GID = '961366332';

function processLinksCSV(text){
  try{
    const rows = parseCSV(text).filter(r => r.some(cell => cell && cell.trim()));
    if(!rows.length){ console.warn('[links] таблица пуста'); return; }

    const header = rows[0].map(h => (h || '').trim().toLowerCase());
    let ci = header.indexOf('category'), ti = header.indexOf('title'), ui = header.indexOf('url');
    let dataRows = rows;
    if(ci !== -1 && ti !== -1 && ui !== -1){
      dataRows = rows.slice(1);
    } else {
      ci = 0; ti = 1; ui = 2;
    }

    const map = new Map();
    dataRows.forEach(r => {
      const cat = (r[ci] || '').trim();
      const title = (r[ti] || '').trim();
      const url = (r[ui] || '').trim();
      if(!cat || !title || !url) return;
      if(!map.has(cat)) map.set(cat, []);
      map.get(cat).push({ title, url });
    });

    linksData = Array.from(map.entries()).map(([name, links]) => ({ name, links }));
    console.log('[links] загружено категорий:', linksData.length, linksData);
    applySavedOrder();
    render(currentQuery);
    loadOrderFromFirebase();
  }catch(e){
    console.error('[links] ошибка разбора:', e);
  }
}

function loadLinksData(){
  window.google = window.google || {};
  window.google.visualization = window.google.visualization || {};
  window.google.visualization.Query = window.google.visualization.Query || {};
  window.google.visualization.Query.setResponse = function(resp){
    console.log('[links] получен ответ от таблицы:', resp);
    if(!resp || resp.status !== 'ok'){
      console.error('[links] таблица вернула ошибку:', resp && (resp.errors || resp.status));
      loadRoadmap();
      return;
    }
    const rows = resp.table.rows.map(r => (r.c || []).map(c => (c && (c.f || c.v) != null) ? String(c.f || c.v) : ''));
    const csvLike = rows.map(r => r.map(v => `"${(v || '').replace(/"/g,'""')}"`).join(',')).join('\n');
    processLinksCSV(csvLike);
    loadRoadmap();
  };

  const oldScript = document.getElementById('links-loader-script');
  if(oldScript) oldScript.remove();

  const script = document.createElement('script');
  script.id = 'links-loader-script';
  script.src = `https://docs.google.com/spreadsheets/d/${LINKS_SHEET_ID}/gviz/tq?gid=${LINKS_GID}&headers=0&tqx=out:json`;
  console.log('[links] загружаю (JSONP):', script.src);
  let loaded = false;
  script.onload = () => { loaded = true; console.log('[links] скрипт загружен успешно'); };
  script.onerror = (e) => {
    console.error('[links] скрипт НЕ загрузился, пробую через CSV+прокси:', e);
    fetchLinksViaProxy();
  };
  document.body.appendChild(script);
  setTimeout(() => { if(!loaded){ console.warn('[links] таймаут JSONP, пробую CSV+прокси'); fetchLinksViaProxy(); } }, 4000);
}

function fetchLinksViaProxy(){
  const csvUrl = `https://docs.google.com/spreadsheets/d/${LINKS_SHEET_ID}/export?format=csv&gid=${LINKS_GID}`;
  const proxied = `https://corsproxy.io/?${encodeURIComponent(csvUrl)}`;
  console.log('[links] fallback fetch:', proxied);
  fetch(proxied)
    .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(text => {
      console.log('[links] fallback ok, символов:', text.length);
      processLinksCSV(text);
      loadRoadmap();
    })
    .catch(e => { console.error('[links] fallback тоже упал:', e); loadRoadmap(); });
}
loadLinksData();

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentQuery = e.target.value;
  render(currentQuery);
});
render('');

const syncRefreshBtn = document.getElementById('syncRefresh');
syncRefreshBtn.addEventListener('click', () => {
  syncRefreshBtn.classList.add('spinning');
  loadLinksData();
  setTimeout(() => syncRefreshBtn.classList.remove('spinning'), 800);
});

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
});

const reorderToggle = document.getElementById('reorderToggle');
reorderToggle.addEventListener('click', () => {
  reorderMode = !reorderMode;
  reorderToggle.classList.toggle('active', reorderMode);
  render(currentQuery);
});

const eventsListBtn = document.getElementById('eventsListBtn');
eventsListBtn.addEventListener('click', () => {
  const panel = document.getElementById('eventsPanel');
  panel.classList.toggle('open');
});

function populateSettingsMenu(){
  const menu = document.getElementById('settingsMenu');
  if(!menu) return;
  menu.innerHTML = '';
  const items = [
    { title: 'GitHub', url: 'https://github.com/slavasamchuk-droid/my-dashboard' },
    { title: 'Firebase', url: 'https://console.firebase.google.com/u/0/project/slava-22b68/database/slava-22b68-default-rtdb/data/~2F' },
    { title: 'Netlify', url: 'https://app.netlify.com/projects/slavaslava/overview' }
  ];
  items.forEach(l => {
    const a = document.createElement('a');
    a.href = l.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = l.title;
    menu.appendChild(a);
  });
}

const settingsToggle = document.getElementById('settingsToggle');
const settingsMenu = document.getElementById('settingsMenu');
populateSettingsMenu();
settingsToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsMenu.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if(!settingsMenu.contains(e.target) && e.target !== settingsToggle){
    settingsMenu.classList.remove('open');
  }
});
</script>
